<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>HAND / GARDEN</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    color:#fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}


/* =====================================================
   CAMERA
===================================================== */

#video{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    opacity:0;

    transition:
        opacity .8s ease;

    z-index:1;

    filter:
        brightness(1.16)
        contrast(.91)
        saturate(1.06)
        blur(.28px);
}

#video.live{
    opacity:1;
}


/* =====================================================
   BEAUTY LIGHT
===================================================== */

#beautyGlow{

    position:fixed;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at 50% 42%,
            rgba(255,255,255,.15) 0%,
            rgba(255,255,255,.065) 30%,
            rgba(255,255,255,.018) 52%,
            rgba(255,255,255,0) 76%
        );

    mix-blend-mode:screen;

    opacity:.9;
}


/* =====================================================
   VIGNETTE
===================================================== */

#shade{

    position:fixed;

    inset:0;

    z-index:5;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 35%,
            rgba(0,0,0,.22) 100%
        );
}


/* =====================================================
   FLOWER CANVAS
===================================================== */

#canvas{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:4;

    pointer-events:none;
}


/* =====================================================
   TOP UI
===================================================== */

#top{

    position:fixed;

    top:24px;

    left:28px;
    right:28px;

    z-index:20;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:9px;

    letter-spacing:.26em;

    color:
        rgba(255,255,255,.65);
}

.dim{

    color:
        rgba(255,255,255,.20);
}


/* =====================================================
   TRACKING SIGNAL
===================================================== */

#tracking{

    display:flex;

    align-items:center;

    gap:8px;

    color:
        rgba(255,255,255,.34);

    transition:
        color .3s ease;
}

#trackingDot{

    width:5px;
    height:5px;

    border-radius:50%;

    background:
        rgba(255,255,255,.25);

    box-shadow:
        0 0 0 rgba(255,255,255,0);

    transition:
        background .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
}

#tracking.tracking{

    color:
        rgba(255,255,255,.72);
}

#tracking.tracking #trackingDot{

    background:#fff;

    box-shadow:
        0 0 9px rgba(255,255,255,.8);

    transform:scale(1.1);
}

#tracking.searching{

    color:
        rgba(255,255,255,.38);
}

#tracking.searching #trackingDot{

    background:
        rgba(255,255,255,.42);

    box-shadow:
        0 0 6px rgba(255,255,255,.25);

    animation:
        pulse 1.2s infinite;
}

#tracking.lost{

    color:
        rgba(255,255,255,.22);
}

#tracking.lost #trackingDot{

    background:
        rgba(255,255,255,.18);

    box-shadow:none;
}

@keyframes pulse{

    0%{
        opacity:.35;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:.35;
    }
}


/* =====================================================
   FLOWER INFO
===================================================== */

#info{

    position:fixed;

    left:28px;

    bottom:28px;

    z-index:20;

    opacity:0;

    transform:
        translateY(10px);

    transition:
        opacity .55s ease,
        transform .55s ease;

    pointer-events:none;
}

#info.show{

    opacity:1;

    transform:
        translateY(0);
}

#flower{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:28px;

    letter-spacing:-.03em;
}

#meaning{

    margin-top:6px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:8px;

    letter-spacing:.24em;

    color:
        rgba(255,255,255,.42);
}


/* =====================================================
   GESTURE STATUS
===================================================== */

#gesture{

    position:fixed;

    right:28px;

    bottom:29px;

    z-index:20;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:8px;

    letter-spacing:.20em;

    color:
        rgba(255,255,255,.34);

    text-align:right;

    transition:
        opacity .25s ease;
}


/* =====================================================
   INTRO
===================================================== */

#intro{

    position:fixed;

    inset:0;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:#000;

    transition:
        opacity .8s ease;
}

#intro.hide{

    opacity:0;

    pointer-events:none;
}

#title{

    margin:0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight:400;

    font-size:
        clamp(52px,9vw,120px);

    line-height:.86;

    letter-spacing:-.055em;
}

#subtitle{

    margin-top:20px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:8px;

    letter-spacing:.35em;

    color:
        rgba(255,255,255,.31);

    text-transform:uppercase;
}

#enter{

    margin-top:48px;

    padding:
        13px 31px;

    border:
        1px solid rgba(255,255,255,.28);

    background:transparent;

    color:#fff;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:8px;

    letter-spacing:.25em;

    cursor:pointer;

    transition:
        background .25s ease,
        color .25s ease,
        border .25s ease;
}

#enter:hover{

    background:#fff;

    color:#000;

    border-color:#fff;
}

#enter:disabled{

    opacity:.45;

    cursor:wait;
}


/* =====================================================
   LOADING
===================================================== */

#loading{

    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:60;

    display:none;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:9px;

    letter-spacing:.22em;

    color:
        rgba(255,255,255,.55);
}

#loading.show{
    display:block;
}


/* =====================================================
   ERROR
===================================================== */

#error{

    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:100;

    width:360px;

    max-width:85vw;

    text-align:center;

    display:none;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:9px;

    line-height:1.8;

    color:
        rgba(255,255,255,.45);
}

#error.show{
    display:block;
}

#error strong{

    display:block;

    margin-bottom:12px;

    color:#fff;

    letter-spacing:.20em;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    #top{

        left:18px;
        right:18px;
        top:18px;
    }

    #info{

        left:18px;
        bottom:21px;
    }

    #gesture{

        right:18px;
        bottom:22px;
    }

    #flower{

        font-size:25px;
    }
}

</style>
</head>


<body>


<!-- CAMERA -->

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<div id="beautyGlow"></div>

<canvas id="canvas"></canvas>

<div id="shade"></div>


<!-- ===================================================
     TOP
=================================================== -->

<div id="top">

    <div>

        HAND
        <span class="dim">/</span>
        GARDEN

    </div>


    <div
        id="tracking"
        class="searching">

        <span id="trackingDot"></span>

        <span id="trackingText">
            OFFLINE
        </span>

    </div>

</div>


<!-- FLOWER INFO -->

<div id="info">

    <div id="flower">
        Rose
    </div>

    <div id="meaning">
        LOVE · COURAGE
    </div>

</div>


<!-- GESTURE -->

<div id="gesture">
    SHOW YOUR HAND
</div>


<!-- INTRO -->

<div id="intro">

    <h1 id="title">
        Hand Garden
    </h1>

    <div id="subtitle">
        A gesture becomes a flower
    </div>

    <button id="enter">
        ENTER
    </button>

</div>


<div id="loading">
    INITIALISING
</div>


<div id="error">

    <strong>
        CAMERA UNAVAILABLE
    </strong>

    Please allow camera access
    and reload the page.

</div>


<script type="module">


/* =====================================================
   MEDIAPIPE
===================================================== */

/*
   IMPORTANT:

   Do NOT use @latest.

   A fixed version prevents CDN changes
   from unexpectedly breaking the app.
*/

import {

    FilesetResolver,
    HandLandmarker

}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";


/* =====================================================
   DOM
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha:true,
            desynchronized:true
        }
    );

const intro =
    document.getElementById("intro");

const enter =
    document.getElementById("enter");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const tracking =
    document.getElementById("tracking");

const trackingText =
    document.getElementById("trackingText");

const info =
    document.getElementById("info");

const flower =
    document.getElementById("flower");

const meaning =
    document.getElementById("meaning");

const gesture =
    document.getElementById("gesture");


/* =====================================================
   CANVAS
===================================================== */

let W =
    window.innerWidth;

let H =
    window.innerHeight;


/*
   Important performance optimisation:

   Retina displays can make a canvas
   extremely expensive.

   Limit DPR to 1.5.
*/

let DPR =
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    );


function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );


    canvas.width =
        Math.floor(W * DPR);

    canvas.height =
        Math.floor(H * DPR);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


resize();


window.addEventListener(
    "resize",
    resize,
    {
        passive:true
    }
);


/* =====================================================
   STATE
===================================================== */

let handLandmarker = null;

let trackerReady = false;

let cameraReady = false;

let running = false;

let detectionBusy = false;


/*
   Detection is intentionally
   much slower than rendering.

   Camera:
   ~30 FPS

   Detection:
   ~12–15 FPS
*/

const DETECTION_INTERVAL =
    72;

let lastDetectionTime =
    0;


/*
   Gesture state.
*/

let candidateGesture = null;

let candidateFrames = 0;

let confirmedGesture = null;


/*
   Flower state.
*/

let lastPlantTime = 0;


/*
   Visual objects.
*/

const plants = [];

const particles = [];


/* =====================================================
   FLOWER DATA
===================================================== */

const FLOWERS = {

    1:{
        name:"Rose",
        meaning:"LOVE · COURAGE",
        type:"rose"
    },

    2:{
        name:"Tulip",
        meaning:"NEW BEGINNINGS",
        type:"tulip"
    },

    3:{
        name:"Sunflower",
        meaning:"JOY · POSITIVITY",
        type:"sunflower"
    },

    4:{
        name:"Peony",
        meaning:"PROSPERITY · BEAUTY",
        type:"peony"
    },

    5:{
        name:"Wildflower",
        meaning:"FREEDOM · GRATITUDE",
        type:"wild"
    }

};


/* =====================================================
   TRACKING UI
===================================================== */

function setTrackingState(
    state
){

    tracking.classList.remove(
        "tracking",
        "searching",
        "lost"
    );

    tracking.classList.add(
        state
    );


    if(
        state === "tracking"
    ){

        trackingText.textContent =
            "TRACKING";

    }else if(
        state === "searching"
    ){

        trackingText.textContent =
            "SEARCHING";

    }else{

        trackingText.textContent =
            "LOST";
    }
}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        throw new Error(
            "Camera API unavailable"
        );
    }


    /*
       1280×720 is intentional.

       1920×1080 gives almost no benefit
       to hand recognition but costs much
       more processing.
    */

    const stream =
        await navigator.mediaDevices.getUserMedia({

            audio:false,

            video:{

                facingMode:{
                    ideal:"user"
                },

                width:{
                    ideal:1280,
                    max:1280
                },

                height:{
                    ideal:720,
                    max:720
                },

                frameRate:{
                    ideal:30,
                    max:30
                }
            }
        });


    video.srcObject =
        stream;


    await new Promise(
        resolve => {

            if(
                video.readyState >= 1
            ){

                resolve();

            }else{

                video.onloadedmetadata =
                    resolve;
            }
        }
    );


    await video.play();


    cameraReady = true;

    video.classList.add(
        "live"
    );


    setTrackingState(
        "searching"
    );
}


/* =====================================================
   MEDIAPIPE
===================================================== */

async function startTracker(){

    const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );


    handLandmarker =
        await HandLandmarker.createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate:"GPU"
                },

                runningMode:"VIDEO",

                numHands:1,

                minHandDetectionConfidence:
                    .50,

                minHandPresenceConfidence:
                    .50,

                minTrackingConfidence:
                    .50
            }
        );


    trackerReady = true;
}


/* =====================================================
   GEOMETRY
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function angle(a,b,c){

    const abx =
        a.x-b.x;

    const aby =
        a.y-b.y;

    const cbx =
        c.x-b.x;

    const cby =
        c.y-b.y;


    const dot =
        abx*cbx+
        aby*cby;


    const magnitude =

        Math.hypot(
            abx,
            aby
        ) *

        Math.hypot(
            cbx,
            cby
        );


    if(
        magnitude === 0
    ){

        return 0;
    }


    return Math.acos(

        Math.max(
            -1,
            Math.min(
                1,
                dot/magnitude
            )
        )

    ) * 180 / Math.PI;
}


/* =====================================================
   FINGER CLASSIFICATION
===================================================== */

function longFingerOpen(
    lm,
    mcp,
    pip,
    dip,
    tip
){

    const a =
        angle(
            lm[mcp],
            lm[pip],
            lm[dip]
        );


    const b =
        angle(
            lm[pip],
            lm[dip],
            lm[tip]
        );


    const full =
        distance(
            lm[mcp],
            lm[tip]
        );


    const partial =
        distance(
            lm[mcp],
            lm[dip]
        );


    return (

        a > 148 &&

        b > 143 &&

        full >
        partial * 1.10
    );
}


/* =====================================================
   THUMB
===================================================== */

function thumbOpen(lm){

    const thumbAngle =
        angle(
            lm[2],
            lm[3],
            lm[4]
        );


    const palmWidth =
        distance(
            lm[5],
            lm[17]
        );


    const thumbToIndex =
        distance(
            lm[4],
            lm[5]
        );


    const thumbToPalm =
        distance(
            lm[4],
            lm[0]
        );


    const spread =
        thumbToIndex /
        Math.max(
            palmWidth,
            .0001
        );


    const palmSpread =
        thumbToPalm /
        Math.max(
            palmWidth,
            .0001
        );


    return (

        thumbAngle > 135 &&

        spread > .58 &&

        palmSpread > .72
    );
}


/* =====================================================
   GESTURE
===================================================== */

function classifyGesture(lm){

    const index =
        longFingerOpen(
            lm,
            5,6,7,8
        );

    const middle =
        longFingerOpen(
            lm,
            9,10,11,12
        );

    const ring =
        longFingerOpen(
            lm,
            13,14,15,16
        );

    const pinky =
        longFingerOpen(
            lm,
            17,18,19,20
        );

    const thumb =
        thumbOpen(lm);


    /*
       5
    */

    if(
        thumb &&
        index &&
        middle &&
        ring &&
        pinky
    ){

        return 5;
    }


    /*
       4

       Explicitly check this before
       3 / 2 / 1.
    */

    if(
        !thumb &&
        index &&
        middle &&
        ring &&
        pinky
    ){

        return 4;
    }


    /*
       3
    */

    if(
        index &&
        middle &&
        ring &&
        !pinky
    ){

        return 3;
    }


    /*
       2
    */

    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){

        return 2;
    }


    /*
       1
    */

    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){

        return 1;
    }


    return null;
}


/* =====================================================
   STABILISER
===================================================== */

function stabilizeGesture(next){

    if(
        next === null
    ){

        candidateGesture =
            null;

        candidateFrames =
            0;

        return confirmedGesture;
    }


    if(
        next === candidateGesture
    ){

        candidateFrames++;

    }else{

        candidateGesture =
            next;

        candidateFrames =
            1;
    }


    /*
       Six frames would be unnecessarily
       slow now that detection is throttled.

       Four consecutive detections
       gives a better balance.
    */

    if(
        candidateFrames >= 4
    ){

        confirmedGesture =
            next;
    }


    return confirmedGesture;
}


/* =====================================================
   SCREEN POSITION
===================================================== */

function screenPosition(p){

    return {

        x:
            (1-p.x)*W,

        y:
            p.y*H

    };
}


/* =====================================================
   PLANT
===================================================== */

function plantFlower(
    type,
    position
){

    const now =
        performance.now();


    /*
       One flower roughly every second.
    */

    if(
        now-lastPlantTime < 950
    ){

        return;
    }


    lastPlantTime =
        now;


    plants.push({

        x:
            position.x,

        y:
            position.y,

        type:type,

        scale:
            .72+
            Math.random()*.35,

        rotation:
            (Math.random()-.5)*.28,

        age:0

    });


    /*
       Keep memory bounded.
    */

    if(
        plants.length > 30
    ){

        plants.shift();
    }


    /*
       Reduced particle count.

       The original 24 × many flowers
       becomes surprisingly expensive.
    */

    for(
        let i=0;
        i<12;
        i++
    ){

        particles.push({

            x:
                position.x,

            y:
                position.y,

            vx:
                (Math.random()-.5)*1.3,

            vy:
                (Math.random()-.9)*1.3,

            size:
                .5+
                Math.random()*1.5,

            life:1

        });
    }
}


/* =====================================================
   FLOWER HELPERS
===================================================== */

function stem(length){

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(

        8,
        length*.30,

        -8,
        length*.70,

        0,
        length
    );

    ctx.stroke();
}


function petal(
    x,
    y,
    rx,
    ry,
    rotation
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.beginPath();

    ctx.ellipse(

        0,
        0,

        rx,
        ry,

        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   ROSE
===================================================== */

function drawRose(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);

    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;

    stem(115);


    ctx.shadowBlur=14;

    ctx.shadowColor =
        "rgba(255,150,200,.5)";

    ctx.strokeStyle =
        "rgba(255,175,208,.92)";


    for(
        let layer=0;
        layer<3;
        layer++
    ){

        const radius =
            9+
            layer*6;

        const count =
            7+
            layer*2;


        for(
            let i=0;
            i<count;
            i++
        ){

            petal(

                0,
                -radius,

                9-layer,
                17-layer*2,

                i*Math.PI*2/count

            );
        }
    }


    ctx.restore();
}


/* =====================================================
   TULIP
===================================================== */

function drawTulip(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);

    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;

    stem(112);


    ctx.shadowBlur=15;

    ctx.shadowColor =
        "rgba(255,170,205,.5)";

    ctx.strokeStyle =
        "rgba(255,185,215,.94)";


    ctx.beginPath();

    ctx.moveTo(
        -28,
        -5
    );

    ctx.bezierCurveTo(
        -30,-34,
        -17,-46,
        -7,-25
    );

    ctx.bezierCurveTo(
        -2,-49,
        5,-51,
        13,-26
    );

    ctx.bezierCurveTo(
        23,-46,
        31,-31,
        28,-5
    );

    ctx.bezierCurveTo(
        20,18,
        -20,18,
        -28,-5
    );

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   SUNFLOWER
===================================================== */

function drawSunflower(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);

    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;

    stem(112);


    ctx.shadowBlur=14;

    ctx.shadowColor =
        "rgba(255,220,120,.5)";

    ctx.strokeStyle =
        "rgba(255,218,128,.95)";


    const petals=20;


    for(
        let i=0;
        i<petals;
        i++
    ){

        ctx.save();

        ctx.rotate(
            i*Math.PI*2/petals
        );

        petal(
            0,
            -25,
            7,
            23,
            0
        );

        ctx.restore();
    }


    ctx.shadowBlur=7;

    ctx.fillStyle =
        "rgba(222,176,92,.95)";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =====================================================
   PEONY
===================================================== */

function drawPeony(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);

    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;

    stem(112);


    ctx.shadowBlur=19;

    ctx.shadowColor =
        "rgba(232,177,230,.55)";

    ctx.strokeStyle =
        "rgba(239,192,230,.94)";


    for(
        let ring=0;
        ring<4;
        ring++
    ){

        const count =
            8+
            ring*2;

        const radius =
            8+
            ring*5;


        for(
            let i=0;
            i<count;
            i++
        ){

            ctx.save();

            ctx.rotate(
                i*Math.PI*2/count
            );

            petal(
                0,
                -radius,
                10-ring,
                17-ring*2,
                0
            );

            ctx.restore();
        }
    }


    ctx.fillStyle =
        "rgba(255,220,243,.82)";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =====================================================
   WILDFLOWER
===================================================== */

function drawWildflower(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    const colors=[

        "rgba(255,183,215,.94)",
        "rgba(199,185,255,.94)",
        "rgba(255,222,153,.94)",
        "rgba(183,232,201,.94)",
        "rgba(240,198,255,.94)"

    ];


    for(
        let i=0;
        i<5;
        i++
    ){

        const dx =
            (i-2)*14;


        ctx.strokeStyle =
            "rgba(126,181,141,.68)";


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.quadraticCurveTo(

            dx*.3,
            50,

            dx,
            110
        );

        ctx.stroke();


        ctx.shadowBlur=11;

        ctx.shadowColor =
            colors[i];

        ctx.strokeStyle =
            colors[i];


        for(
            let p=0;
            p<6;
            p++
        ){

            ctx.save();

            ctx.translate(
                dx,
                -25
            );

            ctx.rotate(
                p*Math.PI*2/6
            );

            petal(
                0,
                -8,
                4,
                10,
                0
            );

            ctx.restore();
        }
    }


    ctx.restore();
}


/* =====================================================
   RENDER LOOP
===================================================== */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       Flowers
    */

    for(
        let i=0;
        i<plants.length;
        i++
    ){

        const p =
            plants[i];


        p.age += .026;


        const growth =
            Math.min(
                p.age,
                1
            );


        const scale =
            p.scale *
            growth;


        switch(p.type){

            case "rose":

                drawRose(
                    p.x,
                    p.y,
                    scale,
                    p.rotation
                );

                break;


            case "tulip":

                drawTulip(
                    p.x,
                    p.y,
                    scale,
                    p.rotation
                );

                break;


            case "sunflower":

                drawSunflower(
                    p.x,
                    p.y,
                    scale,
                    p.rotation
                );

                break;


            case "peony":

                drawPeony(
                    p.x,
                    p.y,
                    scale,
                    p.rotation
                );

                break;


            case "wild":

                drawWildflower(
                    p.x,
                    p.y,
                    scale,
                    p.rotation
                );

                break;
        }
    }


    /*
       Particles
    */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += .012;

        p.life -= .018;


        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );

            continue;
        }


        ctx.globalAlpha =
            p.life*.7;

        ctx.fillStyle =
            "#fff";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha=1;


    requestAnimationFrame(
        render
    );
}


render();


/* =====================================================
   HAND DETECTION
===================================================== */

function processHandFrame(
    timestamp
){

    if(
        !trackerReady ||
        !cameraReady ||
        !handLandmarker
    ){

        return;
    }


    if(
        video.readyState < 2
    ){

        return;
    }


    if(
        detectionBusy
    ){

        return;
    }


    /*
       THROTTLE

       This is the main performance fix.

       Camera can run at 30 FPS,
       but hand recognition only needs
       roughly 13 FPS.
    */

    if(
        timestamp-lastDetectionTime
        <
        DETECTION_INTERVAL
    ){

        return;
    }


    lastDetectionTime =
        timestamp;


    detectionBusy=true;


    try{

        const result =
            handLandmarker.detectForVideo(
                video,
                timestamp
            );


        if(
            result &&
            result.landmarks &&
            result.landmarks.length
        ){

            setTrackingState(
                "tracking"
            );


            const lm =
                result.landmarks[0];


            const rawGesture =
                classifyGesture(lm);


            const stableGesture =
                stabilizeGesture(
                    rawGesture
                );


            if(
                stableGesture
            ){

                const data =
                    FLOWERS[
                        stableGesture
                    ];


                flower.textContent =
                    data.name;


                meaning.textContent =
                    data.meaning;


                info.classList.add(
                    "show"
                );


                gesture.textContent =

                    stableGesture +
                    " FINGER" +
                    (
                        stableGesture === 1
                        ? ""
                        : "S"
                    ) +
                    " · " +
                    data.name;


                /*
                   Plant position.

                   5:
                   palm centre.

                   1–4:
                   index fingertip.
                */

                let point;


                if(
                    stableGesture === 5
                ){

                    point={

                        x:
                            (
                                lm[0].x+
                                lm[9].x
                            )/2,

                        y:
                            (
                                lm[0].y+
                                lm[9].y
                            )/2

                    };

                }else{

                    point =
                        lm[8];
                }


                plantFlower(

                    data.type,

                    screenPosition(
                        point
                    )
                );


            }else{

                info.classList.remove(
                    "show"
                );


                gesture.textContent =
                    "HOLD GESTURE";
            }


        }else{

            /*
               Camera is alive,
               but no hand.
            */

            setTrackingState(
                "searching"
            );


            candidateGesture =
                null;

            candidateFrames =
                0;

            confirmedGesture =
                null;


            info.classList.remove(
                "show"
            );


            gesture.textContent =
                "SHOW YOUR HAND";
        }


    }catch(err){

        console.warn(
            "Hand tracking:",
            err
        );

    }finally{

        detectionBusy=false;
    }
}


/* =====================================================
   VIDEO FRAME LOOP
===================================================== */

function startDetectionLoop(){

    /*
       Modern browsers:
       requestVideoFrameCallback.

       This avoids running detection
       against duplicate video frames.
    */

    if(
        video.requestVideoFrameCallback
    ){

        function onVideoFrame(
            now,
            metadata
        ){

            if(
                !running
            ){

                return;
            }


            /*
               performance.now() is used because
               MediaPipe requires monotonically
               increasing timestamps.
            */

            processHandFrame(
                performance.now()
            );


            video.requestVideoFrameCallback(
                onVideoFrame
            );
        }


        video.requestVideoFrameCallback(
            onVideoFrame
        );


        return;
    }


    /*
       Fallback for older browsers.
    */

    let lastFrame =
        0;


    function fallback(
        now
    ){

        if(
            !running
        ){

            return;
        }


        if(
            now-lastFrame >= 33
        ){

            lastFrame =
                now;

            processHandFrame(
                now
            );
        }


        requestAnimationFrame(
            fallback
        );
    }


    requestAnimationFrame(
        fallback
    );
}


/* =====================================================
   START
===================================================== */

enter.addEventListener(
    "click",
    async()=>{

        if(
            running
        ){

            return;
        }


        enter.disabled=true;

        enter.textContent =
            "STARTING";


        loading.classList.add(
            "show"
        );


        try{

            setTrackingState(
                "searching"
            );


            await startCamera();


            loading.textContent =
                "LOADING TRACKER";


            await startTracker();


            running=true;


            trackingText.textContent =
                "SEARCHING";


            loading.classList.remove(
                "show"
            );


            intro.classList.add(
                "hide"
            );


            gesture.textContent =
                "SHOW YOUR HAND";


            startDetectionLoop();


        }catch(err){

            console.error(
                "HAND GARDEN ERROR:",
                err
            );


            loading.classList.remove(
                "show"
            );


            errorBox.classList.add(
                "show"
            );


            setTrackingState(
                "lost"
            );


            enter.disabled=false;

            enter.textContent =
                "RETRY";
        }
    }
);


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            document.hidden
        ){

            gesture.textContent =
                "PAUSED";

        }else if(
            running
        ){

            setTrackingState(
                "searching"
            );

            gesture.textContent =
                "SHOW YOUR HAND";
        }
    }
);

</script>
