<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hand Garden — Gesture Study</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050706;
    color: #f4f3ef;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    cursor: crosshair;
}


/* =========================
   CAMERA
========================= */

#camera {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0;

    filter:
        brightness(0.48)
        contrast(1.08)
        saturate(0.55);

    transition: opacity 1.4s ease;

    z-index: 1;
}

#camera.visible {
    opacity: 1;
}


/* =========================
   CANVAS
========================= */

#art {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 3;

    pointer-events: none;
}


/* =========================
   OVERLAY
========================= */

#overlay {
    position: fixed;
    inset: 0;

    z-index: 4;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(0,0,0,0) 25%,
            rgba(0,0,0,0.42) 100%
        );
}


/* =========================
   GRAIN
========================= */

#grain {
    position: fixed;
    inset: 0;

    z-index: 5;

    pointer-events: none;

    opacity: 0.055;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}


/* =========================
   TOP UI
========================= */

#top-left {

    position: fixed;

    top: 25px;
    left: 28px;

    z-index: 10;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 10px;

    letter-spacing: 0.22em;

    color:
        rgba(255,255,255,0.62);
}

#top-left span {

    color:
        rgba(255,255,255,0.22);

}


/* =========================
   STATUS
========================= */

#status {

    position: fixed;

    top: 25px;
    right: 28px;

    z-index: 10;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: 0.18em;

    color:
        rgba(255,255,255,0.3);

}


/* =========================
   FLOWER INFO
========================= */

#info {

    position: fixed;

    left: 28px;
    bottom: 27px;

    z-index: 10;

    opacity: 0;

    transform:
        translateY(8px);

    transition:
        opacity .5s ease,
        transform .5s ease;

    pointer-events: none;
}

#info.show {

    opacity: 1;

    transform:
        translateY(0);
}

#flower {

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 10px;

    letter-spacing: 0.22em;

    text-transform: uppercase;

}

#meaning {

    margin-top: 6px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: 0.15em;

    color:
        rgba(255,255,255,0.38);

    text-transform: uppercase;
}


/* =========================
   HINT
========================= */

#hint {

    position: fixed;

    left: 50%;
    bottom: 27px;

    transform:
        translateX(-50%);

    z-index: 10;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: 0.18em;

    color:
        rgba(255,255,255,0.24);

    text-transform: uppercase;

    transition:
        opacity .5s ease;

}

#hint.hide {
    opacity: 0;
}


/* =========================
   INTRO
========================= */

#intro {

    position: fixed;

    inset: 0;

    z-index: 30;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:
        radial-gradient(
            circle at center,
            #101913 0%,
            #050706 55%,
            #030404 100%
        );

    transition:
        opacity 1s ease,
        visibility 1s ease;

}

#intro.hidden {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

}


#title {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight: 400;

    font-size:
        clamp(48px, 8vw, 100px);

    letter-spacing:
        -0.045em;

    line-height: 0.9;

    margin: 0;

}


#subtitle {

    margin-top: 18px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: 0.32em;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.35);

}


#enter {

    margin-top: 48px;

    padding:
        14px 30px;

    border:
        1px solid
        rgba(255,255,255,0.28);

    background:
        transparent;

    color:
        rgba(255,255,255,0.9);

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: 0.22em;

    cursor: pointer;

    transition:
        all .3s ease;

}

#enter:hover {

    background:
        rgba(255,255,255,0.95);

    color:
        #050706;

    border-color:
        white;

}


/* =========================
   ERROR
========================= */

#error {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 40;

    width: min(90%, 420px);

    text-align: center;

    display: none;

}

#error.visible {
    display: block;
}

#error-title {

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 10px;

    letter-spacing: 0.18em;

    margin-bottom: 12px;

}

#error-text {

    font-size: 12px;

    line-height: 1.7;

    color:
        rgba(255,255,255,0.45);

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #top-left {
        left: 18px;
        top: 18px;
    }

    #status {
        right: 18px;
        top: 18px;
    }

    #info {
        left: 18px;
        bottom: 18px;
    }

    #hint {
        bottom: 18px;
    }

}

</style>
</head>


<body>


<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>


<canvas id="art"></canvas>

<div id="overlay"></div>

<div id="grain"></div>


<div id="top-left">
    HAND <span>/</span> GARDEN
</div>


<div id="status">
    STANDBY
</div>


<div id="info">

    <div id="flower">
        ROSE
    </div>

    <div id="meaning">
        LOVE · COURAGE
    </div>

</div>


<div id="hint">
    show your hand
</div>


<!-- INTRO -->

<section id="intro">

    <h1 id="title">
        Hand Garden
    </h1>

    <div id="subtitle">
        gesture becomes memory
    </div>

    <button id="enter">
        ENTER EXPERIENCE
    </button>

</section>


<div id="error">

    <div id="error-title">
        CAMERA UNAVAILABLE
    </div>

    <div id="error-text">
        Please allow camera access and reload the page.
    </div>

</div>



<script type="module">

/* =========================================================
   MEDIAPIPE
========================================================= */

import {
    FilesetResolver,
    HandLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


/* =========================================================
   ELEMENTS
========================================================= */

const camera =
    document.getElementById("camera");

const canvas =
    document.getElementById("art");

const ctx =
    canvas.getContext("2d");

const intro =
    document.getElementById("intro");

const enter =
    document.getElementById("enter");

const status =
    document.getElementById("status");

const hint =
    document.getElementById("hint");

const info =
    document.getElementById("info");

const flowerText =
    document.getElementById("flower");

const meaningText =
    document.getElementById("meaning");

const errorBox =
    document.getElementById("error");


/* =========================================================
   STATE
========================================================= */

let tracker = null;

let stream = null;

let lastVideoTime = -1;

let width =
    window.innerWidth;

let height =
    window.innerHeight;

let lastPlantTime = 0;

let lastGesture = null;

let flowers = [];

let particles = [];

let handVisible = false;


/* =========================================================
   FLOWERS
========================================================= */

const FLOWER_TYPES = {

    1: {

        name:
            "ROSE",

        meaning:
            "LOVE · COURAGE",

        type:
            "rose"

    },

    2: {

        name:
            "TULIP",

        meaning:
            "NEW BEGINNINGS",

        type:
            "tulip"

    },

    3: {

        name:
            "SUNFLOWER",

        meaning:
            "JOY · POSITIVITY",

        type:
            "sunflower"

    },

    5: {

        name:
            "WILDFLOWERS",

        meaning:
            "FREEDOM · GRATITUDE",

        type:
            "wild"

    }

};


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   CAMERA
========================================================= */

async function openCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "getUserMedia is unavailable"
        );

    }

    stream =
        await navigator.mediaDevices
        .getUserMedia({

            audio: false,

            video: {

                facingMode: "user",

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                }

            }

        });

    camera.srcObject =
        stream;

    await new Promise(
        resolve => {

            camera.onloadedmetadata =
                resolve;

        }
    );

    await camera.play();

    camera.classList.add(
        "visible"
    );

}


/* =========================================================
   CREATE HAND TRACKER
========================================================= */

async function createTracker() {

    const vision =
        await FilesetResolver
        .forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );


    tracker =
        await HandLandmarker
        .createFromOptions(
            vision,
            {

                baseOptions: {

                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate:
                        "GPU"

                },

                runningMode:
                    "VIDEO",

                numHands:
                    1,

                minHandDetectionConfidence:
                    0.5,

                minHandPresenceConfidence:
                    0.5,

                minTrackingConfidence:
                    0.5

            }
        );

}


/* =========================================================
   FINGER DETECTION
========================================================= */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


function fingerExtended(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );

}


function countFingers(
    landmarks,
    handedness
) {

    let count = 0;


    /* INDEX */

    if (
        fingerExtended(
            landmarks,
            8,
            6
        )
    ) {
        count++;
    }


    /* MIDDLE */

    if (
        fingerExtended(
            landmarks,
            12,
            10
        )
    ) {
        count++;
    }


    /* RING */

    if (
        fingerExtended(
            landmarks,
            16,
            14
        )
    ) {
        count++;
    }


    /* PINKY */

    if (
        fingerExtended(
            landmarks,
            20,
            18
        )
    ) {
        count++;
    }


    /* THUMB */

    const thumbTip =
        landmarks[4];

    const thumbIP =
        landmarks[3];

    const thumbMCP =
        landmarks[2];


    const thumbDistance =
        distance(
            thumbTip,
            thumbMCP
        );

    const thumbIPDistance =
        distance(
            thumbIP,
            thumbMCP
        );


    if (
        thumbDistance >
        thumbIPDistance * 1.25
    ) {

        count++;

    }


    return count;
}


/* =========================================================
   SCREEN POSITION
========================================================= */

function handToScreen(point) {

    return {

        x:
            (1 - point.x) *
            width,

        y:
            point.y *
            height

    };

}


/* =========================================================
   PLANT FLOWER
========================================================= */

function plantFlower(
    gesture,
    point
) {

    const now =
        performance.now();


    if (
        now - lastPlantTime <
        800
    ) {

        return;

    }


    const flower =
        FLOWER_TYPES[gesture];


    if (!flower) {

        return;

    }


    lastPlantTime =
        now;


    flowerText.textContent =
        flower.name;

    meaningText.textContent =
        flower.meaning;

    info.classList.add(
        "show"
    );


    flowers.push({

        x:
            point.x,

        y:
            point.y,

        type:
            flower.type,

        size:
            0.7 +
            Math.random() * 0.45,

        rotation:
            (
                Math.random() -
                0.5
            ) * 0.3,

        age:
            0

    });


    if (
        flowers.length >
        35
    ) {

        flowers.shift();

    }


    createParticles(
        point.x,
        point.y
    );

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        particles.push({

            x:
                x,

            y:
                y,

            vx:
                (
                    Math.random() -
                    0.5
                ) * 1.8,

            vy:
                (
                    Math.random() -
                    0.8
                ) * 1.5,

            life:
                1,

            size:
                0.7 +
                Math.random() * 1.7

        });

    }

}


/* =========================================================
   GLOW
========================================================= */

function drawGlow(
    x,
    y,
    radius,
    alpha
) {

    const gradient =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );

    gradient.addColorStop(
        0,
        `rgba(255,255,255,${alpha})`
    );

    gradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   STEM
========================================================= */

function drawStem(
    height,
    curve
) {

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(
        curve,
        height * 0.3,
        -curve,
        height * 0.7,
        0,
        height
    );

    ctx.stroke();

}


/* =========================================================
   ROSE
========================================================= */

function drawRose(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    drawGlow(
        0,
        0,
        70,
        0.035
    );


    /* stem */

    ctx.strokeStyle =
        "rgba(142,184,150,0.75)";

    ctx.lineWidth =
        1.2;

    drawStem(
        115,
        9
    );


    /* petals */

    ctx.strokeStyle =
        "rgba(255,180,205,0.88)";

    ctx.lineWidth =
        1.05;


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const angle =
            i *
            Math.PI *
            2 /
            10;


        ctx.save();

        ctx.rotate(
            angle
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            -22,
            14,
            24,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();

    }


    /* centre */

    ctx.fillStyle =
        "rgba(255,218,228,0.95)";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   TULIP
========================================================= */

function drawTulip(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    drawGlow(
        0,
        0,
        65,
        0.03
    );


    /* stem */

    ctx.strokeStyle =
        "rgba(142,190,151,0.78)";

    ctx.lineWidth =
        1.25;

    drawStem(
        115,
        -7
    );


    /* tulip */

    ctx.strokeStyle =
        "rgba(246,177,198,0.9)";

    ctx.lineWidth =
        1.2;

    ctx.beginPath();

    ctx.moveTo(
        -27,
        -5
    );

    ctx.bezierCurveTo(
        -28,
        -30,
        -20,
        -45,
        -10,
        -30
    );

    ctx.bezierCurveTo(
        -3,
        -55,
        3,
        -55,
        10,
        -30
    );

    ctx.bezierCurveTo(
        20,
        -45,
        28,
        -30,
        27,
        -5
    );

    ctx.bezierCurveTo(
        22,
        14,
        -22,
        14,
        -27,
        -5
    );

    ctx.stroke();


    /* leaf */

    ctx.strokeStyle =
        "rgba(150,198,157,0.65)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        62
    );

    ctx.bezierCurveTo(
        -20,
        52,
        -31,
        70,
        -37,
        83
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   SUNFLOWER
========================================================= */

function drawSunflower(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    drawGlow(
        0,
        0,
        75,
        0.035
    );


    /* stem */

    ctx.strokeStyle =
        "rgba(154,193,151,0.75)";

    ctx.lineWidth =
        1.2;

    drawStem(
        115,
        6
    );


    /* petals */

    ctx.strokeStyle =
        "rgba(247,213,126,0.9)";

    ctx.lineWidth =
        1.15;


    for (
        let i = 0;
        i < 16;
        i++
    ) {

        const angle =
            i *
            Math.PI *
            2 /
            16;


        ctx.save();

        ctx.rotate(
            angle
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            -27,
            7,
            23,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();

    }


    /* centre */

    ctx.fillStyle =
        "rgba(218,171,87,0.9)";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   WILDFLOWERS
========================================================= */

function drawWildflowers(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    drawGlow(
        0,
        0,
        80,
        0.03
    );


    const colours = [

        "rgba(255,189,211,0.9)",

        "rgba(190,180,255,0.9)",

        "rgba(255,222,155,0.9)",

        "rgba(185,228,197,0.9)"

    ];


    for (
        let stem = 0;
        stem < 5;
        stem++
    ) {

        const offset =
            (stem - 2) * 14;


        const flowerY =
            -25 -
            Math.abs(stem - 2) * 6;


        ctx.strokeStyle =
            "rgba(148,193,155,0.68)";

        ctx.lineWidth =
            0.9;


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.bezierCurveTo(
            offset * 0.3,
            35,
            offset,
            70,
            offset,
            115
        );

        ctx.stroke();


        ctx.strokeStyle =
            colours[
                stem %
                colours.length
            ];


        for (
            let p = 0;
            p < 5;
            p++
        ) {

            const angle =
                p *
                Math.PI *
                2 /
                5;


            ctx.save();

            ctx.translate(
                offset,
                flowerY
            );

            ctx.rotate(
                angle
            );

            ctx.beginPath();

            ctx.ellipse(
                0,
                -8,
                4,
                10,
                0,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();

        }

    }


    ctx.restore();

}


/* =========================================================
   DRAW FLOWERS
========================================================= */

function drawFlowers() {

    for (
        const flower
        of flowers
    ) {

        flower.age +=
            0.018;


        const growth =
            Math.min(
                flower.age * 2,
                1
            );


        const scale =
            flower.size *
            growth;


        const sway =
            Math.sin(
                flower.age * 2
            ) * 2;


        if (
            flower.type ===
            "rose"
        ) {

            drawRose(
                flower.x,
                flower.y + sway,
                scale,
                flower.rotation
            );

        }


        if (
            flower.type ===
            "tulip"
        ) {

            drawTulip(
                flower.x,
                flower.y + sway,
                scale,
                flower.rotation
            );

        }


        if (
            flower.type ===
            "sunflower"
        ) {

            drawSunflower(
                flower.x,
                flower.y + sway,
                scale,
                flower.rotation
            );

        }


        if (
            flower.type ===
            "wild"
        ) {

            drawWildflowers(
                flower.x,
                flower.y + sway,
                scale,
                flower.rotation
            );

        }

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles() {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            0.01;

        p.life -=
            0.012;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();

        ctx.globalAlpha =
            p.life * 0.65;

        ctx.fillStyle =
            "#ffffff";

        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            "#ffffff";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

    }

}


/* =========================================================
   RENDER LOOP
========================================================= */

function render() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawFlowers();

    drawParticles();


    requestAnimationFrame(
        render
    );

}

render();


/* =========================================================
   DETECTION
========================================================= */

async function detectHands() {

    if (
        !tracker ||
        camera.readyState <
        2
    ) {

        requestAnimationFrame(
            detectHands
        );

        return;

    }


    if (
        camera.currentTime !==
        lastVideoTime
    ) {

        lastVideoTime =
            camera.currentTime;


        try {

            const result =
                tracker.detectForVideo(
                    camera,
                    performance.now()
                );


            if (
                result.landmarks &&
                result.landmarks.length >
                0
            ) {

                handVisible =
                    true;


                const landmarks =
                    result.landmarks[0];


                let handedness =
                    "Right";


                if (
                    result.handedness &&
                    result.handedness[0] &&
                    result.handedness[0][0]
                ) {

                    handedness =
                        result.handedness[0][0]
                        .categoryName;

                }


                const fingers =
                    countFingers(
                        landmarks,
                        handedness
                    );


                const flower =
                    FLOWER_TYPES[fingers];


                if (flower) {

                    if (
                        fingers !==
                        lastGesture
                    ) {

                        lastGesture =
                            fingers;

                        flowerText.textContent =
                            flower.name;

                        meaningText.textContent =
                            flower.meaning;

                        info.classList.add(
                            "show"
                        );

                    }


                    /*
                       Index fingertip
                       is the planting point
                    */

                    const point =
                        handToScreen(
                            landmarks[8]
                        );


                    plantFlower(
                        fingers,
                        point
                    );

                }


                /*
                    Cursor glow
                */

                const cursor =
                    handToScreen(
                        landmarks[8]
                    );


                ctx.save();

                ctx.fillStyle =
                    "rgba(255,255,255,0.85)";

                ctx.shadowBlur =
                    20;

                ctx.shadowColor =
                    "rgba(255,255,255,0.8)";

                ctx.beginPath();

                ctx.arc(
                    cursor.x,
                    cursor.y,
                    1.8,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                ctx.restore();


                hint.classList.add(
                    "hide"
                );

            } else {

                handVisible =
                    false;

                lastGesture =
                    null;

            }

        } catch (err) {

            console.error(
                "Hand detection:",
                err
            );

        }

    }


    requestAnimationFrame(
        detectHands
    );

}


/* =========================================================
   START
========================================================= */

enter.addEventListener(
    "click",
    async () => {

        enter.disabled =
            true;

        enter.textContent =
            "INITIALISING";


        try {

            status.textContent =
                "CAMERA";


            /*
                1.
                CAMERA
            */

            await openCamera();


            /*
                2.
                MEDIAPIPE
            */

            status.textContent =
                "TRACKING";


            await createTracker();


            /*
                3.
                EXPERIENCE
            */

            status.textContent =
                "LIVE";


            intro.classList.add(
                "hidden"
            );


            detectHands();


        } catch (error) {

            console.error(
                error
            );


            status.textContent =
                "ERROR";


            errorBox.classList.add(
                "visible"
            );


            enter.disabled =
                false;

            enter.textContent =
                "TRY AGAIN";

        }

    }
);
