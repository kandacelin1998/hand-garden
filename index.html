<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAND / GARDEN</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #000;
}


/* =====================================================
   CAMERA
===================================================== */

#video {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0;

    transition:
        opacity 1s ease;

    /*
       BEAUTY CAMERA

       brighter
       softer
       slightly luminous
    */

    filter:
        brightness(1.12)
        contrast(.92)
        saturate(1.08)
        blur(.35px);

    z-index: 1;
}

#video.live {
    opacity: 1;
}


/*
   SOFT LIGHT OVERLAY

   Gives the camera a subtle
   Japanese photo-booth glow.
*/

#beautyGlow {

    position: fixed;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.10) 0%,
            rgba(255,255,255,.035) 42%,
            rgba(255,255,255,0) 72%
        );

    mix-blend-mode: screen;

}


/* =====================================================
   FLOWER CANVAS
===================================================== */

#canvas {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 4;

    pointer-events: none;

}


/* =====================================================
   UI DARK VIGNETTE
===================================================== */

#shade {

    position: fixed;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 35%,
            rgba(0,0,0,.28) 100%
        );

}


/* =====================================================
   TOP
===================================================== */

#top {

    position: fixed;

    top: 25px;

    left: 28px;
    right: 28px;

    z-index: 20;

    display: flex;

    justify-content: space-between;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: .25em;

    color:
        rgba(255,255,255,.62);

}

.dim {
    color:
        rgba(255,255,255,.22);
}


/* =====================================================
   FLOWER INFO
===================================================== */

#info {

    position: fixed;

    left: 28px;

    bottom: 27px;

    z-index: 20;

    opacity: 0;

    transform:
        translateY(8px);

    transition:
        opacity .6s ease,
        transform .6s ease;

    pointer-events: none;

}

#info.show {

    opacity: 1;

    transform:
        translateY(0);

}

#flower {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 27px;

    letter-spacing:
        -.025em;

}

#meaning {

    margin-top: 6px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .23em;

    color:
        rgba(255,255,255,.42);

}


/* =====================================================
   GESTURE
===================================================== */

#gesture {

    position: fixed;

    right: 28px;

    bottom: 28px;

    z-index: 20;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .2em;

    color:
        rgba(255,255,255,.32);

}


/* =====================================================
   INTRO
===================================================== */

#intro {

    position: fixed;

    inset: 0;

    z-index: 50;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: #000;

    transition:
        opacity .8s ease;

}

#intro.hide {

    opacity: 0;

    pointer-events: none;

}

#title {

    margin: 0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight: 400;

    font-size:
        clamp(52px, 9vw, 120px);

    line-height: .85;

    letter-spacing:
        -.055em;

}

#subtitle {

    margin-top: 20px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .35em;

    color:
        rgba(255,255,255,.3);

    text-transform: uppercase;

}

#enter {

    margin-top: 48px;

    padding: 13px 30px;

    border:
        1px solid
        rgba(255,255,255,.3);

    background:
        transparent;

    color:
        white;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .25em;

    cursor: pointer;

    transition:
        background .25s ease,
        color .25s ease,
        border .25s ease;

}

#enter:hover {

    background: white;

    color: black;

    border-color: white;

}

#enter:disabled {

    opacity: .5;

    cursor: wait;

}


/* =====================================================
   LOADING
===================================================== */

#loading {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 60;

    display: none;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: .2em;

    color:
        rgba(255,255,255,.55);

}

#loading.show {
    display: block;
}


/* =====================================================
   ERROR
===================================================== */

#error {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 100;

    width: 360px;

    max-width: 85vw;

    text-align: center;

    display: none;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    line-height: 1.8;

    color:
        rgba(255,255,255,.45);

}

#error.show {
    display: block;
}

#error strong {

    display: block;

    margin-bottom: 12px;

    color: white;

    letter-spacing: .2em;

}


@media(max-width:600px){

    #top {

        left: 18px;
        right: 18px;
        top: 18px;

    }

    #info {

        left: 18px;
        bottom: 20px;

    }

    #gesture {

        right: 18px;
        bottom: 20px;

    }

}

</style>
</head>


<body>


<!-- CAMERA -->

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>


<!-- BEAUTY LIGHT -->

<div id="beautyGlow"></div>


<!-- FLOWERS -->

<canvas id="canvas"></canvas>


<div id="shade"></div>


<!-- TOP -->

<div id="top">

    <div>
        HAND <span class="dim">/</span> GARDEN
    </div>

    <div id="status">
        OFFLINE
    </div>

</div>


<!-- FLOWER INFO -->

<div id="info">

    <div id="flower">
        Rose
    </div>

    <div id="meaning">
        LOVE · COURAGE
    </div>

</div>


<div id="gesture">
    SHOW YOUR HAND
</div>


<!-- INTRO -->

<div id="intro">

    <h1 id="title">
        Hand Garden
    </h1>

    <div id="subtitle">
        A gesture becomes a flower
    </div>

    <button id="enter">
        ENTER
    </button>

</div>


<div id="loading">
    INITIALISING
</div>


<div id="error">

    <strong>
        CAMERA UNAVAILABLE
    </strong>

    Please allow camera access and reload the page.

</div>


<script type="module">

import {
    FilesetResolver,
    HandLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const intro =
    document.getElementById("intro");

const enter =
    document.getElementById("enter");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");

const flower =
    document.getElementById("flower");

const meaning =
    document.getElementById("meaning");

const gesture =
    document.getElementById("gesture");


/* =====================================================
   CANVAS
===================================================== */

let W =
    window.innerWidth;

let H =
    window.innerHeight;


function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;


    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   STATE
===================================================== */

let handLandmarker =
    null;

let lastVideoTime =
    -1;

let currentGesture =
    null;

let stableGesture =
    null;

let gestureFrames =
    0;

let lastPlant =
    0;

const plants = [];

const particles = [];


/* =====================================================
   FLOWERS
===================================================== */

const FLOWERS = {

    1: {

        name:
            "Rose",

        meaning:
            "LOVE · COURAGE",

        type:
            "rose"

    },


    2: {

        name:
            "Tulip",

        meaning:
            "NEW BEGINNINGS",

        type:
            "tulip"

    },


    3: {

        name:
            "Sunflower",

        meaning:
            "JOY · POSITIVITY",

        type:
            "sunflower"

    },


    4: {

        name:
            "Peony",

        meaning:
            "PROSPERITY · BEAUTY",

        type:
            "peony"

    },


    5: {

        name:
            "Wildflower",

        meaning:
            "FREEDOM · GRATITUDE",

        type:
            "wild"

    }

};


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        throw new Error(
            "Camera API unavailable"
        );

    }


    const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video: {

                facingMode:
                    "user",

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 30
                }

            },

            audio:
                false

        });


    video.srcObject =
        stream;


    await new Promise(
        resolve => {

            video.onloadedmetadata =
                resolve;

        }
    );


    await video.play();


    video.classList.add(
        "live"
    );

}


/* =====================================================
   TRACKER
===================================================== */

async function createTracker(){

    const vision =
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"

        );


    handLandmarker =
        await HandLandmarker
        .createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate:
                        "GPU"

                },


                runningMode:
                    "VIDEO",


                numHands:
                    1,


                minHandDetectionConfidence:
                    .42,


                minHandPresenceConfidence:
                    .42,


                minTrackingConfidence:
                    .42

            }

        );

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(

        a.x-b.x,

        a.y-b.y

    );

}


/* =====================================================
   FINGER DETECTION
===================================================== */

/*
   Instead of simply checking y-position,
   this version checks the angle and distance
   of each finger.

   This is much more tolerant of rotated hands.
*/

function fingerExtended(
    lm,
    tip,
    pip,
    mcp
){

    const a =
        distance(
            lm[tip],
            lm[pip]
        );

    const b =
        distance(
            lm[pip],
            lm[mcp]
        );

    const c =
        distance(
            lm[tip],
            lm[mcp]
        );


    /*
       A straight finger has
       tip → MCP significantly
       longer than the individual
       segments.
    */

    return (
        c >
        b * 1.18
        &&
        a >
        b * .75
    );

}


/* =====================================================
   COUNT FINGERS
===================================================== */

function countFingers(lm){

    let count =
        0;


    /*
       INDEX
    */

    if(
        fingerExtended(
            lm,
            8,
            6,
            5
        )
    ){

        count++;

    }


    /*
       MIDDLE
    */

    if(
        fingerExtended(
            lm,
            12,
            10,
            9
        )
    ){

        count++;

    }


    /*
       RING
    */

    if(
        fingerExtended(
            lm,
            16,
            14,
            13
        )
    ){

        count++;

    }


    /*
       PINKY
    */

    if(
        fingerExtended(
            lm,
            20,
            18,
            17
        )
    ){

        count++;

    }


    /*
       THUMB

       Use the direction from
       thumb MCP → thumb tip
       relative to palm.
    */

    const thumbTip =
        lm[4];

    const thumbMCP =
        lm[2];

    const thumbIP =
        lm[3];


    const thumbLength =
        distance(
            thumbTip,
            thumbMCP
        );


    const palmWidth =
        distance(
            lm[5],
            lm[17]
        );


    const thumbAngle =
        Math.abs(
            thumbTip.x -
            thumbIP.x
        );


    if(

        thumbLength >
        palmWidth * .48

        &&

        thumbAngle >
        .025

    ){

        count++;

    }


    return count;

}


/* =====================================================
   STABLE GESTURE
===================================================== */

function stabilizeGesture(
    detected
){

    if(
        detected ===
        currentGesture
    ){

        gestureFrames++;

    }
    else{

        currentGesture =
            detected;

        gestureFrames =
            0;

    }


    /*
       Require roughly 4
       consecutive frames.

       This prevents flickering
       between 4 and 5.
    */

    if(
        gestureFrames >= 4
    ){

        stableGesture =
            detected;

    }


    return stableGesture;

}


/* =====================================================
   SCREEN POSITION
===================================================== */

function screenPosition(p){

    return {

        x:
            (1-p.x) * W,

        y:
            p.y * H

    };

}


/* =====================================================
   PLANT
===================================================== */

function plant(
    type,
    point
){

    const now =
        performance.now();


    if(
        now-lastPlant <
        800
    ){

        return;

    }


    lastPlant =
        now;


    plants.push({

        x:
            point.x,

        y:
            point.y,

        type:
            type,

        scale:
            .72 +
            Math.random()*.38,

        rotation:
            (
                Math.random()-.5
            )*.25,

        age:
            0

    });


    if(
        plants.length >
        32
    ){

        plants.shift();

    }


    /*
       Dreamy particles
    */

    for(
        let i=0;
        i<24;
        i++
    ){

        particles.push({

            x:
                point.x,

            y:
                point.y,

            vx:
                (
                    Math.random()-.5
                )*1.7,

            vy:
                (
                    Math.random()-.9
                )*1.6,

            size:
                .5+
                Math.random()*1.8,

            life:
                1

        });

    }

}


/* =====================================================
   STEM
===================================================== */

function stem(
    length=110
){

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(

        9,
        length*.3,

        -8,
        length*.7,

        0,
        length

    );

    ctx.stroke();

}


/* =====================================================
   PETAL
===================================================== */

function petal(
    x,
    y,
    rx,
    ry,
    rotation
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        rx,
        ry,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   ROSE — DREAMY
===================================================== */

function drawRose(
    x,
    y,
    s,
    r
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(r);

    ctx.scale(
        s,
        s
    );


    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth =
        1;


    stem(115);


    /*
       soft rose petals
    */

    ctx.shadowBlur =
        14;

    ctx.shadowColor =
        "rgba(255,155,200,.45)";


    ctx.strokeStyle =
        "rgba(255,170,205,.9)";


    for(
        let layer=0;
        layer<3;
        layer++
    ){

        const radius =
            9+
            layer*6;


        const petals =
            7+
            layer*2;


        for(
            let i=0;
            i<petals;
            i++
        ){

            petal(

                0,

                -radius,

                9-layer,

                17-layer*2,

                i*Math.PI*2/petals

            );

        }

    }


    ctx.restore();

}


/* =====================================================
   TULIP
===================================================== */

function drawTulip(
    x,
    y,
    s,
    r
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(r);

    ctx.scale(
        s,
        s
    );


    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth =
        1;


    stem(112);


    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        "rgba(255,170,205,.5)";


    ctx.strokeStyle =
        "rgba(255,180,211,.92)";


    ctx.beginPath();

    ctx.moveTo(
        -28,
        -5
    );

    ctx.bezierCurveTo(
        -30,
        -34,
        -17,
        -46,
        -7,
        -25
    );

    ctx.bezierCurveTo(
        -2,
        -49,
        5,
        -51,
        13,
        -26
    );

    ctx.bezierCurveTo(
        23,
        -46,
        31,
        -31,
        28,
        -5
    );

    ctx.bezierCurveTo(
        20,
        18,
        -20,
        18,
        -28,
        -5
    );

    ctx.stroke();


    ctx.restore();

}


/* =====================================================
   SUNFLOWER
===================================================== */

function drawSunflower(
    x,
    y,
    s,
    r
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(r);

    ctx.scale(
        s,
        s
    );


    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth =
        1;


    stem(112);


    ctx.shadowBlur =
        16;

    ctx.shadowColor =
        "rgba(255,220,120,.45)";


    ctx.strokeStyle =
        "rgba(255,218,128,.95)";


    const petals =
        20;


    for(
        let i=0;
        i<petals;
        i++
    ){

        const a =
            i*Math.PI*2/petals;


        ctx.save();

        ctx.rotate(a);


        petal(
            0,
            -25,
            7,
            23,
            0
        );


        ctx.restore();

    }


    ctx.shadowBlur =
        10;

    ctx.fillStyle =
        "rgba(222,176,92,.95)";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   PEONY
===================================================== */

function drawPeony(
    x,
    y,
    s,
    r
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(r);

    ctx.scale(
        s,
        s
    );


    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth =
        1;


    stem(112);


    ctx.shadowBlur =
        22;

    ctx.shadowColor =
        "rgba(232,177,230,.55)";


    ctx.strokeStyle =
        "rgba(239,192,230,.92)";


    /*
       many overlapping soft petals
    */

    for(
        let ring=0;
        ring<4;
        ring++
    ){

        const count =
            8+
            ring*2;


        const radius =
            8+
            ring*5;


        for(
            let i=0;
            i<count;
            i++
        ){

            const a =
                i*Math.PI*2/count;


            ctx.save();

            ctx.rotate(a);


            petal(
                0,
                -radius,
                10-ring,
                17-ring*2,
                0
            );


            ctx.restore();

        }

    }


    ctx.fillStyle =
        "rgba(255,220,243,.8)";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =====================================================
   WILDFLOWER
===================================================== */

function drawWild(
    x,
    y,
    s,
    r
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(r);

    ctx.scale(
        s,
        s
    );


    const colors = [

        "rgba(255,183,215,.92)",

        "rgba(199,185,255,.92)",

        "rgba(255,222,153,.92)",

        "rgba(183,232,201,.92)",

        "rgba(240,198,255,.92)"

    ];


    for(
        let i=0;
        i<5;
        i++
    ){

        const dx =
            (i-2)*14;


        ctx.strokeStyle =
            "rgba(126,181,141,.65)";


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.quadraticCurveTo(
            dx*.3,
            50,
            dx,
            110
        );

        ctx.stroke();


        ctx.shadowBlur =
            13;

        ctx.shadowColor =
            colors[i];


        ctx.strokeStyle =
            colors[i];


        for(
            let p=0;
            p<6;
            p++
        ){

            ctx.save();

            ctx.translate(
                dx,
                -25
            );

            ctx.rotate(
                p*Math.PI*2/6
            );


            petal(
                0,
                -8,
                4,
                10,
                0
            );


            ctx.restore();

        }

    }


    ctx.restore();

}


/* =====================================================
   RENDER
===================================================== */

function animate(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    for(
        const p of plants
    ){

        p.age +=
            .026;


        const growth =
            Math.min(
                p.age,
                1
            );


        const scale =
            p.scale*
            growth;


        if(
            p.type === "rose"
        ){

            drawRose(
                p.x,
                p.y,
                scale,
                p.rotation
            );

        }


        if(
            p.type === "tulip"
        ){

            drawTulip(
                p.x,
                p.y,
                scale,
                p.rotation
            );

        }


        if(
            p.type === "sunflower"
        ){

            drawSunflower(
                p.x,
                p.y,
                scale,
                p.rotation
            );

        }


        if(
            p.type === "peony"
        ){

            drawPeony(
                p.x,
                p.y,
                scale,
                p.rotation
            );

        }


        if(
            p.type === "wild"
        ){

            drawWild(
                p.x,
                p.y,
                scale,
                p.rotation
            );

        }

    }


    /*
       FLOATING LIGHT
    */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            .012;

        p.life -=
            .014;


        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();

        ctx.globalAlpha =
            p.life*.7;

        ctx.fillStyle =
            "white";

        ctx.shadowBlur =
            14;

        ctx.shadowColor =
            "white";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }


    requestAnimationFrame(
        animate
    );

}


animate();


/* =====================================================
   HAND DETECTION
===================================================== */

async function detectHands(){

    if(
        !handLandmarker ||
        video.readyState < 2
    ){

        requestAnimationFrame(
            detectHands
        );

        return;

    }


    if(
        video.currentTime !==
        lastVideoTime
    ){

        lastVideoTime =
            video.currentTime;


        try{

            const result =
                handLandmarker
                .detectForVideo(

                    video,

                    performance.now()

                );


            if(
                result.landmarks &&
                result.landmarks.length
            ){

                const lm =
                    result.landmarks[0];


                const fingers =
                    countFingers(lm);


                const stable =
                    stabilizeGesture(
                        fingers
                    );


                const data =
                    FLOWERS[stable];


                if(data){

                    if(
                        currentGesture ===
                        stable
                    ){

                        flower.textContent =
                            data.name;

                        meaning.textContent =
                            data.meaning;

                        info.classList.add(
                            "show"
                        );

                    }


                    gesture.textContent =
                        stable +
                        " FINGER" +
                        (stable === 1 ? "" : "S") +
                        " · " +
                        data.name;


                    const point =
                        screenPosition(
                            lm[8]
                        );


                    plant(
                        data.type,
                        point
                    );

                }

            }
            else{

                currentGesture =
                    null;

                stableGesture =
                    null;

                gestureFrames =
                    0;

                gesture.textContent =
                    "SHOW YOUR HAND";

            }

        }
        catch(err){

            console.error(
                "HAND TRACKING ERROR:",
                err
            );

        }

    }


    requestAnimationFrame(
        detectHands
    );

}


/* =====================================================
   ENTER
===================================================== */

enter.addEventListener(
    "click",

    async () => {

        enter.disabled =
            true;

        enter.textContent =
            "STARTING";


        loading.classList.add(
            "show"
        );


        try{

            status.textContent =
                "CAMERA";


            await openCamera();


            status.textContent =
                "TRACKER";


            await createTracker();


            loading.classList.remove(
                "show"
            );


            intro.classList.add(
                "hide"
            );


            status.textContent =
                "LIVE";


            detectHands();


        }
        catch(err){

            console.error(
                "HAND GARDEN ERROR:",
                err
            );


            loading.classList.remove(
                "show"
            );


            errorBox.classList.add(
                "show"
            );


            status.textContent =
                "ERROR";


            enter.disabled =
                false;

            enter.textContent =
                "RETRY";

        }

    }

);
