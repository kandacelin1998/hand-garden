<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hand Garden 🌸</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07100b;
    color: white;
    font-family: Georgia, "Times New Roman", serif;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(91, 143, 101, 0.22),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #07100b,
            #102017
        );
}

/* CAMERA */

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0.62;

    filter:
        brightness(0.68)
        saturate(0.75);
}

/* FLOWER CANVAS */

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 3;
}

/* DARK OVERLAY */

#app::after {

    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 4;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,0.55)
        );
}

/* HEADER */

header {

    position: absolute;

    top: 32px;

    left: 0;
    right: 0;

    text-align: center;

    z-index: 10;

    pointer-events: none;
}

.title {

    font-size: clamp(38px, 5vw, 64px);

    font-weight: 400;

    letter-spacing: 0.08em;

    text-shadow:
        0 4px 30px rgba(0,0,0,0.6);
}

.subtitle {

    margin-top: 8px;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 0.35em;

    text-transform: uppercase;

    opacity: 0.55;
}

/* STATUS */

#status {

    position: absolute;

    top: 125px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 0.1em;

    opacity: 0.7;
}

/* MEANING */

#meaning {

    position: absolute;

    left: 50%;

    bottom: 55px;

    transform: translateX(-50%);

    width: 90%;

    max-width: 650px;

    text-align: center;

    z-index: 10;

    pointer-events: none;
}

#flowerName {

    font-size: clamp(30px, 5vw, 55px);

    letter-spacing: 0.1em;

    font-weight: 400;

    text-shadow:
        0 0 35px rgba(255,255,255,0.25);
}

#flowerMeaning {

    margin-top: 8px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 0.2em;

    text-transform: uppercase;

    opacity: 0.85;
}

#flowerQuote {

    margin-top: 14px;

    font-size: 15px;

    font-style: italic;

    opacity: 0.7;
}

/* INSTRUCTIONS */

#instructions {

    position: absolute;

    left: 28px;

    top: 50%;

    transform: translateY(-50%);

    width: 215px;

    padding: 20px;

    border:

        1px solid
        rgba(255,255,255,0.16);

    border-radius: 20px;

    background:
        rgba(5,15,9,0.38);

    backdrop-filter:
        blur(15px);

    z-index: 10;
}

.instruction-title {

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 0.25em;

    text-transform: uppercase;

    opacity: 0.5;

    margin-bottom: 15px;
}

.gesture {

    display: flex;

    align-items: center;

    gap: 12px;

    margin: 12px 0;
}

.gesture-icon {

    width: 32px;

    font-size: 23px;
}

.gesture-text {

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 0.04em;
}

.gesture-text span {

    display: block;

    margin-top: 3px;

    font-size: 8px;

    text-transform: uppercase;

    opacity: 0.45;
}

/* MOBILE */

@media(max-width:700px) {

    #instructions {

        left: 12px;

        top: auto;

        bottom: 25px;

        transform: none;

        width: 175px;

        padding: 14px;
    }

    #meaning {

        bottom: 155px;
    }

}

</style>

</head>


<body>


<div id="app">


<video
    id="video"
    autoplay
    playsinline
    muted>
</video>


<canvas id="canvas"></canvas>


<header>

    <div class="title">
        Hand Garden
    </div>

    <div class="subtitle">
        Bloom with your gesture
    </div>

</header>


<div id="status">
    Opening the garden...
</div>


<div id="instructions">

    <div class="instruction-title">
        Your gestures
    </div>


    <div class="gesture">

        <div class="gesture-icon">
            ☝️
        </div>

        <div class="gesture-text">

            Rose

            <span>
                Love · Courage
            </span>

        </div>

    </div>


    <div class="gesture">

        <div class="gesture-icon">
            ✌️
        </div>

        <div class="gesture-text">

            Tulip

            <span>
                New Beginnings
            </span>

        </div>

    </div>


    <div class="gesture">

        <div class="gesture-icon">
            🤟
        </div>

        <div class="gesture-text">

            Sunflower

            <span>
                Joy · Positivity
            </span>

        </div>

    </div>


    <div class="gesture">

        <div class="gesture-icon">
            🖐️
        </div>

        <div class="gesture-text">

            Wildflowers

            <span>
                Freedom · Gratitude
            </span>

        </div>

    </div>

</div>


<div id="meaning">

    <div id="flowerName">
        Your garden is waiting
    </div>

    <div id="flowerMeaning">
        Show me your hand
    </div>

    <div id="flowerQuote">
        Every gesture plants a little meaning.
    </div>

</div>


</div>


<script type="module">


import {

    FilesetResolver,

    HandLandmarker

}

from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


/* ELEMENTS */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("status");

const flowerName =
    document.getElementById("flowerName");

const flowerMeaning =
    document.getElementById("flowerMeaning");

const flowerQuote =
    document.getElementById("flowerQuote");


/* VARIABLES */

let handLandmarker = null;

let lastVideoTime = -1;

let flowers = [];

let particles = [];

let currentGesture = null;

let lastFlowerTime = 0;

let width =
    window.innerWidth;

let height =
    window.innerHeight;


/* FLOWER DATA */

const FLOWERS = {

    one: {

        name: "ROSE",

        meaning:
            "Love · Beauty · Courage",

        quote:
            "The rose blooms when the heart is brave enough to open.",

        type:
            "rose"

    },


    two: {

        name: "TULIP",

        meaning:
            "New Beginnings · Forgiveness",

        quote:
            "Every spring begins with the courage to start again.",

        type:
            "tulip"

    },


    three: {

        name: "SUNFLOWER",

        meaning:
            "Joy · Positivity · Adoration",

        quote:
            "Turn toward what makes you feel alive.",

        type:
            "sunflower"

    },


    five: {

        name: "WILDFLOWERS",

        meaning:
            "Freedom · Gratitude · Abundance",

        quote:
            "Some beautiful things are never meant to be controlled.",

        type:
            "wildflower"

    }

};


/* RESIZE */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* CAMERA */

async function startCamera() {

    status.textContent =
        "Opening camera...";


    const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video: {

                facingMode:
                    "user",

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                }

            },

            audio: false

        });


    video.srcObject =
        stream;


    await video.play();

}


/* MEDIAPIPE */

async function startHandTracking() {

    status.textContent =
        "Growing the garden...";


    const vision =
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


    handLandmarker =
        await HandLandmarker
        .createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate:
                        "GPU"

                },

                runningMode:
                    "VIDEO",

                numHands:
                    1,

                minHandDetectionConfidence:
                    0.4,

                minHandPresenceConfidence:
                    0.4,

                minTrackingConfidence:
                    0.4

            }

        );


    status.textContent =
        "The garden is listening ✨";

}


/* COUNT FINGERS */

function countFingers(
    landmarks,
    handedness
) {

    let count = 0;


    /* INDEX */

    if (
        landmarks[8].y <
        landmarks[6].y
    ) {

        count++;

    }


    /* MIDDLE */

    if (
        landmarks[12].y <
        landmarks[10].y
    ) {

        count++;

    }


    /* RING */

    if (
        landmarks[16].y <
        landmarks[14].y
    ) {

        count++;

    }


    /* PINKY */

    if (
        landmarks[20].y <
        landmarks[18].y
    ) {

        count++;

    }


    /* THUMB */

    if (
        handedness === "Right"
    ) {

        if (
            landmarks[4].x <
            landmarks[3].x
        ) {

            count++;

        }

    } else {

        if (
            landmarks[4].x >
            landmarks[3].x
        ) {

            count++;

        }

    }


    return count;

}


/* GESTURE */

function getGesture(
    fingers
) {

    if (fingers === 1)
        return "one";

    if (fingers === 2)
        return "two";

    if (fingers === 3)
        return "three";

    if (fingers >= 4)
        return "five";


    /*
        IMPORTANT:

        Even if MediaPipe thinks
        the hand is closed, we still
        return one so flowers appear.
    */

    return "one";

}


/* SCREEN POSITION */

function toScreen(point) {

    return {

        x:
            (1 - point.x) *
            width,

        y:
            point.y *
            height

    };

}


/* PLANT FLOWER */

function plantFlower(
    gesture,
    position
) {

    const flower =
        FLOWERS[gesture];


    if (!flower)
        return;


    flowerName.textContent =
        flower.name;

    flowerMeaning.textContent =
        flower.meaning;

    flowerQuote.textContent =
        flower.quote;


    const now =
        Date.now();


    /*
        Don't create hundreds
        of flowers every second.
    */

    if (
        now -
        lastFlowerTime <
        700
    ) {

        return;

    }


    lastFlowerTime =
        now;


    flowers.push({

        x:
            position.x,

        y:
            position.y,

        type:
            flower.type,

        life:
            0,

        /*
            BIG FLOWERS
        */

        scale:
            1.0 +
            Math.random() *
            0.35,

        rotation:
            (
                Math.random() -
                0.5
            ) * 0.3

    });


    /*
        Sparkles
    */

    createParticles(
        position.x,
        position.y
    );


    /*
        Keep maximum
        garden size reasonable.
    */

    if (
        flowers.length >
        40
    ) {

        flowers.shift();

    }

}


/* PARTICLES */

function createParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                (
                    Math.random() -
                    0.5
                ) * 2,

            vy:
                -Math.random() *
                2,

            life: 1,

            size:
                2 +
                Math.random() * 4

        });

    }

}


/* ROSE */

function drawRose(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        rotation
    );


    ctx.scale(
        scale,
        scale
    );


    /* STEM */

    ctx.strokeStyle =
        "#5d9860";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(
        0,
        10
    );

    ctx.quadraticCurveTo(
        -8,
        50,
        0,
        100
    );

    ctx.stroke();


    /* LEAVES */

    ctx.fillStyle =
        "#4b814f";


    ctx.beginPath();

    ctx.ellipse(
        -12,
        60,
        9,
        22,
        -0.7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
        12,
        72,
        9,
        22,
        0.7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* PETALS */

    const gradient =
        ctx.createRadialGradient(
            0,
            -5,
            2,
            0,
            0,
            48
        );


    gradient.addColorStop(
        0,
        "#fff4f7"
    );

    gradient.addColorStop(
        0.35,
        "#ff9fbd"
    );

    gradient.addColorStop(
        1,
        "#c82f63"
    );


    ctx.fillStyle =
        gradient;


    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const angle =
            i *
            Math.PI *
            2 /
            12;


        const px =
            Math.cos(angle) *
            18;


        const py =
            Math.sin(angle) *
            18;


        ctx.beginPath();

        ctx.ellipse(
            px,
            py,
            22,
            30,
            angle,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* CENTER */

    ctx.fillStyle =
        "#9b214c";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* TULIP */

function drawTulip(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    /* STEM */

    ctx.strokeStyle =
        "#5b9a61";

    ctx.lineWidth =
        4;

    ctx.beginPath();

    ctx.moveTo(
        0,
        10
    );

    ctx.quadraticCurveTo(
        5,
        50,
        0,
        105
    );

    ctx.stroke();


    /* LEAVES */

    ctx.fillStyle =
        "#4f8957";


    ctx.beginPath();

    ctx.ellipse(
        -13,
        72,
        9,
        28,
        -0.6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
        13,
        78,
        9,
        28,
        0.6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* FLOWER */

    const gradient =
        ctx.createLinearGradient(
            -30,
            -45,
            30,
            20
        );


    gradient.addColorStop(
        0,
        "#ffe0e9"
    );

    gradient.addColorStop(
        0.4,
        "#ff83a5"
    );

    gradient.addColorStop(
        1,
        "#d63269"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.moveTo(
        -30,
        0
    );


    ctx.bezierCurveTo(
        -32,
        -38,
        -14,
        -52,
        0,
        -25
    );


    ctx.bezierCurveTo(
        14,
        -52,
        32,
        -38,
        30,
        0
    );


    ctx.bezierCurveTo(
        20,
        22,
        -20,
        22,
        -30,
        0
    );


    ctx.fill();


    ctx.restore();

}


/* SUNFLOWER */

function drawSunflower(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    /* STEM */

    ctx.strokeStyle =
        "#629a51";

    ctx.lineWidth =
        5;

    ctx.beginPath();

    ctx.moveTo(
        0,
        15
    );

    ctx.quadraticCurveTo(
        5,
        55,
        0,
        110
    );

    ctx.stroke();


    /* LEAVES */

    ctx.fillStyle =
        "#57904d";


    ctx.beginPath();

    ctx.ellipse(
        -15,
        72,
        10,
        28,
        -0.7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.ellipse(
        15,
        82,
        10,
        28,
        0.7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* PETALS */

    ctx.fillStyle =
        "#f8c843";


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const angle =
            i *
            Math.PI *
            2 /
            18;


        ctx.save();


        ctx.rotate(
            angle
        );


        ctx.beginPath();

        ctx.ellipse(
            0,
            -30,
            11,
            30,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.restore();

    }


    /* CENTER */

    const center =
        ctx.createRadialGradient(
            0,
            0,
            2,
            0,
            0,
            23
        );


    center.addColorStop(
        0,
        "#a56a28"
    );

    center.addColorStop(
        1,
        "#3b2415"
    );


    ctx.fillStyle =
        center;


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        23,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* WILDFLOWERS */

function drawWildflowers(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    const colors = [

        "#ffabc5",
        "#d2a9ff",
        "#ffe08b",
        "#ffffff",
        "#9bd8bd"

    ];


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const ox =
            (
                i - 2.5
            ) * 18;


        const oy =
            -Math.random() * 30;


        /* STEM */

        ctx.strokeStyle =
            "#619765";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            ox,
            oy
        );

        ctx.lineTo(
            ox,
            100
        );

        ctx.stroke();


        /* FLOWER */

        const color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        ctx.fillStyle =
            color;


        for (
            let p = 0;
            p < 5;
            p++
        ) {

            const angle =
                p *
                Math.PI *
                2 /
                5;


            ctx.beginPath();

            ctx.ellipse(
                ox +
                Math.cos(angle) *
                8,

                oy +
                Math.sin(angle) *
                8,

                6,
                10,
                angle,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }


        ctx.fillStyle =
            "#e7bd5c";


        ctx.beginPath();

        ctx.arc(
            ox,
            oy,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* DRAW FLOWERS */

function drawFlowers() {

    for (
        const flower of flowers
    ) {

        flower.life +=
            0.025;


        const growth =
            Math.min(
                flower.life,
                1
            );


        const sway =
            Math.sin(
                flower.life * 3
            ) * 2;


        const scale =
            flower.scale *
            growth;


        if (
            flower.type ===
            "rose"
        ) {

            drawRose(
                flower.x,
                flower.y + sway,
                scale,
                flower.rotation
            );

        }


        if (
            flower.type ===
            "tulip"
        ) {

            drawTulip(
                flower.x,
                flower.y + sway,
                scale,
                flower.rotation
            );

        }


        if (
            flower.type ===
            "sunflower"
        ) {

            drawSunflower(
                flower.x,
                flower.y + sway,
                scale,
                flower.rotation
            );

        }


        if (
            flower.type ===
            "wildflower"
        ) {

            drawWildflowers(
                flower.x,
                flower.y + sway,
                scale,
                flower.rotation
            );

        }

    }

}


/* PARTICLES */

function drawParticles() {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            0.012;

        p.life -=
            0.012;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            "#ffeaf1";

        ctx.shadowBlur =
            15;

        ctx.shadowColor =
            "#ffb5cd";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

    }

}


/* ANIMATION */

function animate() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawFlowers();

    drawParticles();


    requestAnimationFrame(
        animate
    );

}


animate();


/* DETECTION */

function detectHands() {

    if (
        !handLandmarker ||
        video.readyState < 2
    ) {

        requestAnimationFrame(
            detectHands
        );

        return;

    }


    if (
        video.currentTime ===
        lastVideoTime
    ) {

        requestAnimationFrame(
            detectHands
        );

        return;

    }


    lastVideoTime =
        video.currentTime;


    const detection =
        handLandmarker
        .detectForVideo(
            video,
            performance.now()
        );


    if (
        detection.landmarks &&
        detection.landmarks.length
        > 0
    ) {

        const landmarks =
            detection.landmarks[0];


        let handedness =
            "Right";


        if (
            detection.handedness &&
            detection.handedness.length
        ) {

            handedness =
                detection
                .handedness[0][0]
                .categoryName;

        }


        const fingers =
            countFingers(
                landmarks,
                handedness
            );


        /*
            IMPORTANT:

            0 fingers =
            rose

            1 =
            rose

            2 =
            tulip

            3 =
            sunflower

            4/5 =
            wildflowers
        */

        let gesture;


        if (
            fingers === 2
        ) {

            gesture = "two";

        }

        else if (
            fingers === 3
        ) {

            gesture = "three";

        }

        else if (
            fingers >= 4
        ) {

            gesture = "five";

        }

        else {

            gesture = "one";

        }


        /*
            USE INDEX FINGER
            POSITION
        */

        const point =
            toScreen(
                landmarks[8]
            );


        plantFlower(
            gesture,
            point
        );

    }


    requestAnimationFrame(
        detectHands
    );

}


/* START */

async function start() {

    try {

        await startCamera();

        await startHandTracking();

        status.textContent =
            "The garden is listening ✨";


        detectHands();

    }

    catch (error) {

        console.error(
            error
        );


        status.textContent =
            "Something went wrong";

        flowerName.textContent =
            "Garden asleep";

        flowerMeaning.textContent =
            error.message;

        flowerQuote.textContent =
            "Check the browser console.";

    }

}


start();

</script>
