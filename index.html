<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>HAND / GARDEN</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

/* =====================================================
   CAMERA
===================================================== */

#video{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    opacity:0;

    transition:
        opacity 1s ease;

    z-index:1;

    /*
       Soft Japanese photobooth look.
       Bright but not washed out.
    */

    filter:
        brightness(1.14)
        contrast(.90)
        saturate(1.05)
        blur(.32px);
}

#video.live{
    opacity:1;
}


/* =====================================================
   CAMERA SOFT LIGHT
===================================================== */

#beautyGlow{

    position:fixed;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at 50% 42%,
            rgba(255,255,255,.14) 0%,
            rgba(255,255,255,.065) 30%,
            rgba(255,255,255,.018) 52%,
            rgba(255,255,255,0) 76%
        );

    mix-blend-mode:screen;

    opacity:.9;
}


/* =====================================================
   VIGNETTE
===================================================== */

#shade{

    position:fixed;

    inset:0;

    z-index:5;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 35%,
            rgba(0,0,0,.23) 100%
        );
}


/* =====================================================
   FLOWER CANVAS
===================================================== */

#canvas{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:4;

    pointer-events:none;
}


/* =====================================================
   TOP UI
===================================================== */

#top{

    position:fixed;

    top:24px;

    left:28px;
    right:28px;

    z-index:20;

    display:flex;

    justify-content:space-between;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:9px;

    letter-spacing:.26em;

    color:
        rgba(255,255,255,.65);
}

.dim{
    color:
        rgba(255,255,255,.20);
}


/* =====================================================
   FLOWER INFO
===================================================== */

#info{

    position:fixed;

    left:28px;

    bottom:28px;

    z-index:20;

    opacity:0;

    transform:
        translateY(10px);

    transition:
        opacity .65s ease,
        transform .65s ease;

    pointer-events:none;
}

#info.show{

    opacity:1;

    transform:
        translateY(0);
}

#flower{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:28px;

    letter-spacing:-.03em;
}

#meaning{

    margin-top:6px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:8px;

    letter-spacing:.24em;

    color:
        rgba(255,255,255,.42);
}


/* =====================================================
   GESTURE STATUS
===================================================== */

#gesture{

    position:fixed;

    right:28px;

    bottom:29px;

    z-index:20;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:8px;

    letter-spacing:.20em;

    color:
        rgba(255,255,255,.34);

    text-align:right;
}


/* =====================================================
   INTRO
===================================================== */

#intro{

    position:fixed;

    inset:0;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:#000;

    transition:
        opacity .8s ease;
}

#intro.hide{

    opacity:0;

    pointer-events:none;
}

#title{

    margin:0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight:400;

    font-size:
        clamp(52px,9vw,120px);

    line-height:.86;

    letter-spacing:-.055em;
}

#subtitle{

    margin-top:20px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:8px;

    letter-spacing:.35em;

    color:
        rgba(255,255,255,.31);

    text-transform:uppercase;
}

#enter{

    margin-top:48px;

    padding:
        13px 31px;

    border:
        1px solid rgba(255,255,255,.28);

    background:
        transparent;

    color:#fff;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:8px;

    letter-spacing:.25em;

    cursor:pointer;

    transition:
        background .25s ease,
        color .25s ease,
        border .25s ease;
}

#enter:hover{

    background:#fff;

    color:#000;

    border-color:#fff;
}

#enter:disabled{

    opacity:.45;

    cursor:wait;
}


/* =====================================================
   LOADING
===================================================== */

#loading{

    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:60;

    display:none;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:9px;

    letter-spacing:.22em;

    color:
        rgba(255,255,255,.55);
}

#loading.show{
    display:block;
}


/* =====================================================
   ERROR
===================================================== */

#error{

    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:100;

    width:360px;

    max-width:85vw;

    text-align:center;

    display:none;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:9px;

    line-height:1.8;

    color:
        rgba(255,255,255,.45);
}

#error.show{
    display:block;
}

#error strong{

    display:block;

    margin-bottom:12px;

    color:#fff;

    letter-spacing:.20em;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    #top{

        left:18px;
        right:18px;
        top:18px;
    }

    #info{

        left:18px;
        bottom:21px;
    }

    #gesture{

        right:18px;
        bottom:22px;
    }
}

</style>
</head>


<body>


<!-- ===================================================
     CAMERA
=================================================== -->

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<div id="beautyGlow"></div>

<canvas id="canvas"></canvas>

<div id="shade"></div>


<!-- ===================================================
     UI
=================================================== -->

<div id="top">

    <div>
        HAND
        <span class="dim">/</span>
        GARDEN
    </div>

    <div id="status">
        OFFLINE
    </div>

</div>


<div id="info">

    <div id="flower">
        Rose
    </div>

    <div id="meaning">
        LOVE · COURAGE
    </div>

</div>


<div id="gesture">
    SHOW YOUR HAND
</div>


<!-- ===================================================
     INTRO
=================================================== -->

<div id="intro">

    <h1 id="title">
        Hand Garden
    </h1>

    <div id="subtitle">
        A gesture becomes a flower
    </div>

    <button id="enter">
        ENTER
    </button>

</div>


<div id="loading">
    INITIALISING
</div>


<div id="error">

    <strong>
        CAMERA UNAVAILABLE
    </strong>

    Please allow camera access
    and reload the page.

</div>


<script type="module">


/* =====================================================
   MEDIAPIPE
===================================================== */

import {
    FilesetResolver,
    HandLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";


/* =====================================================
   DOM
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const intro =
    document.getElementById("intro");

const enter =
    document.getElementById("enter");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");

const flower =
    document.getElementById("flower");

const meaning =
    document.getElementById("meaning");

const gesture =
    document.getElementById("gesture");


/* =====================================================
   CANVAS
===================================================== */

let W =
    window.innerWidth;

let H =
    window.innerHeight;

let DPR =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );


function resize(){

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   GLOBAL STATE
===================================================== */

let handLandmarker = null;

let trackerReady = false;

let cameraReady = false;

let running = false;

let detectionBusy = false;


/*
   Gesture stabilisation.
*/

let candidateGesture = null;

let candidateFrames = 0;

let confirmedGesture = null;


/*
   Flower timing.
*/

let lastPlantTime = 0;


/*
   Visual objects.
*/

const plants = [];

const particles = [];


/* =====================================================
   FLOWER DATA
===================================================== */

const FLOWERS = {

    1:{
        name:"Rose",
        meaning:"LOVE · COURAGE",
        type:"rose"
    },

    2:{
        name:"Tulip",
        meaning:"NEW BEGINNINGS",
        type:"tulip"
    },

    3:{
        name:"Sunflower",
        meaning:"JOY · POSITIVITY",
        type:"sunflower"
    },

    4:{
        name:"Peony",
        meaning:"PROSPERITY · BEAUTY",
        type:"peony"
    },

    5:{
        name:"Wildflower",
        meaning:"FREEDOM · GRATITUDE",
        type:"wild"
    }

};


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        throw new Error(
            "Camera API unavailable"
        );
    }


    const stream =
        await navigator.mediaDevices.getUserMedia({

            audio:false,

            video:{

                facingMode:{
                    ideal:"user"
                },

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                },

                frameRate:{
                    ideal:30,
                    max:30
                }
            }
        });


    video.srcObject =
        stream;


    await new Promise(
        resolve => {

            if(
                video.readyState >= 1
            ){

                resolve();

            }else{

                video.onloadedmetadata =
                    resolve;
            }
        }
    );


    await video.play();


    cameraReady = true;

    video.classList.add(
        "live"
    );
}


/* =====================================================
   MEDIAPIPE INITIALISATION
===================================================== */

async function startTracker(){

    const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );


    handLandmarker =
        await HandLandmarker.createFromOptions(

            vision,

            {

                baseOptions:{

                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate:"GPU"
                },


                runningMode:"VIDEO",

                numHands:1,


                minHandDetectionConfidence:
                    .45,

                minHandPresenceConfidence:
                    .45,

                minTrackingConfidence:
                    .45
            }
        );


    trackerReady = true;
}


/* =====================================================
   GEOMETRY
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function angle(a,b,c){

    const abx =
        a.x-b.x;

    const aby =
        a.y-b.y;

    const cbx =
        c.x-b.x;

    const cby =
        c.y-b.y;


    const dot =
        abx*cbx+
        aby*cby;


    const magnitude =

        Math.hypot(
            abx,
            aby
        ) *

        Math.hypot(
            cbx,
            cby
        );


    if(
        magnitude === 0
    ){
        return 0;
    }


    return Math.acos(

        Math.max(
            -1,
            Math.min(
                1,
                dot/magnitude
            )
        )

    ) * 180 / Math.PI;
}


/* =====================================================
   LONG FINGER CLASSIFICATION
===================================================== */

function longFingerOpen(
    lm,
    mcp,
    pip,
    dip,
    tip
){

    const a =
        angle(
            lm[mcp],
            lm[pip],
            lm[dip]
        );


    const b =
        angle(
            lm[pip],
            lm[dip],
            lm[tip]
        );


    /*
       Finger length.
    */

    const full =
        distance(
            lm[mcp],
            lm[tip]
        );


    const partial =
        distance(
            lm[mcp],
            lm[dip]
        );


    /*
       A finger is open only when:

       - both joints are straight
       - fingertip is sufficiently extended
    */

    return (

        a > 148 &&

        b > 143 &&

        full >
        partial * 1.105
    );
}


/* =====================================================
   THUMB CLASSIFICATION
===================================================== */

/*
   Thumb is deliberately treated differently.

   We compare its geometry against the
   palm rather than just looking at x/y.
*/

function thumbOpen(lm){

    const thumbAngle =
        angle(
            lm[2],
            lm[3],
            lm[4]
        );


    const palmWidth =
        distance(
            lm[5],
            lm[17]
        );


    const thumbTipToIndexMCP =
        distance(
            lm[4],
            lm[5]
        );


    const thumbTipToPalm =
        distance(
            lm[4],
            lm[0]
        );


    const spread =
        thumbTipToIndexMCP /
        Math.max(
            palmWidth,
            .0001
        );


    const palmSpread =
        thumbTipToPalm /
        Math.max(
            palmWidth,
            .0001
        );


    /*
       Strong open thumb.

       Both conditions matter.
    */

    return (

        thumbAngle > 135 &&

        spread > .58 &&

        palmSpread > .72
    );
}


/* =====================================================
   GESTURE CLASSIFIER
===================================================== */

function classifyGesture(lm){

    const index =
        longFingerOpen(
            lm,
            5,6,7,8
        );


    const middle =
        longFingerOpen(
            lm,
            9,10,11,12
        );


    const ring =
        longFingerOpen(
            lm,
            13,14,15,16
        );


    const pinky =
        longFingerOpen(
            lm,
            17,18,19,20
        );


    const thumb =
        thumbOpen(lm);


    /*
       -----------------------------------------------
       OPEN PALM
       -----------------------------------------------
    */

    if(
        thumb &&
        index &&
        middle &&
        ring &&
        pinky
    ){

        return 5;
    }


    /*
       -----------------------------------------------
       FOUR
       -----------------------------------------------

       Four long fingers open,
       thumb clearly folded.

       This is deliberately checked
       before 3 / 2 / 1.
    */

    if(
        !thumb &&
        index &&
        middle &&
        ring &&
        pinky
    ){

        return 4;
    }


    /*
       -----------------------------------------------
       THREE
       -----------------------------------------------
    */

    if(
        index &&
        middle &&
        ring &&
        !pinky
    ){

        return 3;
    }


    /*
       -----------------------------------------------
       TWO
       -----------------------------------------------
    */

    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){

        return 2;
    }


    /*
       -----------------------------------------------
       ONE
       -----------------------------------------------
    */

    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){

        return 1;
    }


    /*
       No confident gesture.
    */

    return null;
}


/* =====================================================
   GESTURE STABILISER
===================================================== */

function stabilizeGesture(next){

    /*
       No valid gesture.
    */

    if(next === null){

        candidateGesture =
            null;

        candidateFrames =
            0;

        return confirmedGesture;
    }


    /*
       Same candidate.
    */

    if(
        next === candidateGesture
    ){

        candidateFrames++;

    }else{

        candidateGesture =
            next;

        candidateFrames =
            1;
    }


    /*
       Need consecutive frames.

       This prevents 4 ↔ 5 flicker.
    */

    if(
        candidateFrames >= 6
    ){

        confirmedGesture =
            next;
    }


    return confirmedGesture;
}


/* =====================================================
   SCREEN POSITION
===================================================== */

function screenPosition(p){

    return {

        x:
            (1-p.x)*W,

        y:
            p.y*H
    };
}


/* =====================================================
   PLANT
===================================================== */

function plantFlower(
    type,
    position
){

    const now =
        performance.now();


    /*
       Prevent excessive spawning.
    */

    if(
        now-lastPlantTime < 900
    ){

        return;
    }


    lastPlantTime =
        now;


    plants.push({

        x:
            position.x,

        y:
            position.y,

        type:type,

        scale:
            .72+
            Math.random()*.35,

        rotation:
            (Math.random()-.5)*.28,

        age:0
    });


    if(
        plants.length > 36
    ){

        plants.shift();
    }


    /*
       Soft particles.
    */

    for(
        let i=0;
        i<24;
        i++
    ){

        particles.push({

            x:
                position.x,

            y:
                position.y,

            vx:
                (Math.random()-.5)*1.5,

            vy:
                (Math.random()-.9)*1.5,

            size:
                .5+
                Math.random()*1.7,

            life:1
        });
    }
}


/* =====================================================
   FLOWER HELPERS
===================================================== */

function stem(length){

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(

        8,
        length*.30,

        -8,
        length*.70,

        0,
        length
    );

    ctx.stroke();
}


function petal(
    x,
    y,
    rx,
    ry,
    rotation
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.beginPath();

    ctx.ellipse(

        0,
        0,

        rx,
        ry,

        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   ROSE
===================================================== */

function drawRose(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;


    stem(115);


    ctx.shadowBlur=17;

    ctx.shadowColor =
        "rgba(255,150,200,.55)";


    ctx.strokeStyle =
        "rgba(255,175,208,.92)";


    for(
        let layer=0;
        layer<3;
        layer++
    ){

        const radius =
            9+
            layer*6;

        const count =
            7+
            layer*2;


        for(
            let i=0;
            i<count;
            i++
        ){

            petal(

                0,

                -radius,

                9-layer,

                17-layer*2,

                i*Math.PI*2/count
            );
        }
    }


    ctx.restore();
}


/* =====================================================
   TULIP
===================================================== */

function drawTulip(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;


    stem(112);


    ctx.shadowBlur=18;

    ctx.shadowColor =
        "rgba(255,170,205,.52)";


    ctx.strokeStyle =
        "rgba(255,185,215,.94)";


    ctx.beginPath();

    ctx.moveTo(
        -28,
        -5
    );

    ctx.bezierCurveTo(
        -30,
        -34,
        -17,
        -46,
        -7,
        -25
    );

    ctx.bezierCurveTo(
        -2,
        -49,
        5,
        -51,
        13,
        -26
    );

    ctx.bezierCurveTo(
        23,
        -46,
        31,
        -31,
        28,
        -5
    );

    ctx.bezierCurveTo(
        20,
        18,
        -20,
        18,
        -28,
        -5
    );

    ctx.stroke();


    ctx.restore();
}


/* =====================================================
   SUNFLOWER
===================================================== */

function drawSunflower(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;


    stem(112);


    ctx.shadowBlur=17;

    ctx.shadowColor =
        "rgba(255,220,120,.52)";


    ctx.strokeStyle =
        "rgba(255,218,128,.95)";


    const petals=20;


    for(
        let i=0;
        i<petals;
        i++
    ){

        ctx.save();

        ctx.rotate(
            i*Math.PI*2/petals
        );

        petal(
            0,
            -25,
            7,
            23,
            0
        );

        ctx.restore();
    }


    ctx.shadowBlur=10;

    ctx.fillStyle =
        "rgba(222,176,92,.95)";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =====================================================
   PEONY
===================================================== */

function drawPeony(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    ctx.strokeStyle =
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;


    stem(112);


    ctx.shadowBlur=24;

    ctx.shadowColor =
        "rgba(232,177,230,.60)";


    ctx.strokeStyle =
        "rgba(239,192,230,.94)";


    for(
        let ring=0;
        ring<4;
        ring++
    ){

        const count =
            8+
            ring*2;

        const radius =
            8+
            ring*5;


        for(
            let i=0;
            i<count;
            i++
        ){

            ctx.save();

            ctx.rotate(
                i*Math.PI*2/count
            );

            petal(
                0,
                -radius,
                10-ring,
                17-ring*2,
                0
            );

            ctx.restore();
        }
    }


    ctx.fillStyle =
        "rgba(255,220,243,.82)";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();
}


/* =====================================================
   WILDFLOWER
===================================================== */

function drawWildflower(
    x,y,s,r
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    const colors=[

        "rgba(255,183,215,.94)",

        "rgba(199,185,255,.94)",

        "rgba(255,222,153,.94)",

        "rgba(183,232,201,.94)",

        "rgba(240,198,255,.94)"
    ];


    for(
        let i=0;
        i<5;
        i++
    ){

        const dx =
            (i-2)*14;


        ctx.strokeStyle =
            "rgba(126,181,141,.68)";


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.quadraticCurveTo(

            dx*.3,
            50,

            dx,
            110
        );

        ctx.stroke();


        ctx.shadowBlur=14;

        ctx.shadowColor =
            colors[i];

        ctx.strokeStyle =
            colors[i];


        for(
            let p=0;
            p<6;
            p++
        ){

            ctx.save();

            ctx.translate(
                dx,
                -25
            );

            ctx.rotate(
                p*Math.PI*2/6
            );

            petal(
                0,
                -8,
                4,
                10,
                0
            );

            ctx.restore();
        }
    }


    ctx.restore();
}


/* =====================================================
   VISUAL LOOP
===================================================== */

function render(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       Flowers.
    */

    for(
        const p of plants
    ){

        p.age += .026;


        const growth =
            Math.min(
                p.age,
                1
            );


        const scale =
            p.scale *
            growth;


        if(
            p.type === "rose"
        ){

            drawRose(
                p.x,
                p.y,
                scale,
                p.rotation
            );
        }


        if(
            p.type === "tulip"
        ){

            drawTulip(
                p.x,
                p.y,
                scale,
                p.rotation
            );
        }


        if(
            p.type === "sunflower"
        ){

            drawSunflower(
                p.x,
                p.y,
                scale,
                p.rotation
            );
        }


        if(
            p.type === "peony"
        ){

            drawPeony(
                p.x,
                p.y,
                scale,
                p.rotation
            );
        }


        if(
            p.type === "wild"
        ){

            drawWildflower(
                p.x,
                p.y,
                scale,
                p.rotation
            );
        }
    }


    /*
       Particles.
    */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += .012;

        p.life -= .014;


        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );

            continue;
        }


        ctx.save();

        ctx.globalAlpha =
            p.life*.7;

        ctx.fillStyle =
            "#fff";

        ctx.shadowBlur=14;

        ctx.shadowColor =
            "#fff";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }


    requestAnimationFrame(
        render
    );
}


render();


/* =====================================================
   HAND PROCESSING
===================================================== */

function processHandFrame(){

    if(
        !trackerReady ||
        !cameraReady ||
        !handLandmarker
    ){

        return;
    }


    if(
        video.readyState < 2
    ){

        return;
    }


    /*
       Never allow concurrent MediaPipe
       inference.
    */

    if(
        detectionBusy
    ){

        return;
    }


    detectionBusy=true;


    try{

        const result =
            handLandmarker.detectForVideo(
                video,
                performance.now()
            );


        /*
           HAND FOUND
        */

        if(
            result &&
            result.landmarks &&
            result.landmarks.length
        ){

            const lm =
                result.landmarks[0];


            const rawGesture =
                classifyGesture(lm);


            const stableGesture =
                stabilizeGesture(
                    rawGesture
                );


            if(
                stableGesture
            ){

                const data =
                    FLOWERS[
                        stableGesture
                    ];


                flower.textContent =
                    data.name;


                meaning.textContent =
                    data.meaning;


                info.classList.add(
                    "show"
                );


                gesture.textContent =

                    stableGesture +

                    " FINGER" +

                    (
                        stableGesture === 1
                        ? ""
                        : "S"
                    ) +

                    " · " +

                    data.name;


                /*
                   Index fingertip is used
                   as the garden planting
                   position.

                   For open palm, use the
                   palm center instead.
                */

                let point;


                if(
                    stableGesture === 5
                ){

                    point = {

                        x:
                            (
                                lm[0].x+
                                lm[9].x
                            )/2,

                        y:
                            (
                                lm[0].y+
                                lm[9].y
                            )/2
                    };

                }else{

                    point =
                        lm[8];
                }


                plantFlower(

                    data.type,

                    screenPosition(
                        point
                    )
                );


            }else{

                info.classList.remove(
                    "show"
                );


                gesture.textContent =
                    "HOLD GESTURE";
            }


        }else{

            /*
               No hand.

               Reset classifier.
            */

            candidateGesture =
                null;

            candidateFrames =
                0;

            confirmedGesture =
                null;


            info.classList.remove(
                "show"
            );


            gesture.textContent =
                "SHOW YOUR HAND";
        }


    }catch(error){

        console.warn(
            "Hand tracking:",
            error
        );

    }finally{

        detectionBusy=false;
    }
}


/* =====================================================
   VIDEO FRAME LOOP
===================================================== */

function startDetectionLoop(){

    if(
        !video.requestVideoFrameCallback
    ){

        /*
           Fallback.
        */

        let lastRun=0;


        function fallback(now){

            if(
                now-lastRun >= 33
            ){

                lastRun=now;

                processHandFrame();
            }


            if(running){

                requestAnimationFrame(
                    fallback
                );
            }
        }


        requestAnimationFrame(
            fallback
        );

        return;
    }


    /*
       Preferred modern path.

       The callback fires when a
       genuinely new video frame
       is available.
    */

    function onVideoFrame(
        now,
        metadata
    ){

        if(
            !running
        ){

            return;
        }


        processHandFrame();


        video.requestVideoFrameCallback(
            onVideoFrame
        );
    }


    video.requestVideoFrameCallback(
        onVideoFrame
    );
}


/* =====================================================
   START APP
===================================================== */

enter.addEventListener(
    "click",
    async()=>{

        if(running)return;


        enter.disabled=true;

        enter.textContent =
            "STARTING";


        loading.classList.add(
            "show"
        );


        try{

            status.textContent =
                "CAMERA";


            await startCamera();


            status.textContent =
                "TRACKER";


            await startTracker();


            /*
               Everything is ready.
            */

            running=true;


            status.textContent =
                "LIVE";


            loading.classList.remove(
                "show"
            );


            intro.classList.add(
                "hide"
            );


            startDetectionLoop();


        }catch(error){

            console.error(
                "HAND GARDEN ERROR:",
                error
            );


            loading.classList.remove(
                "show"
            );


            errorBox.classList.add(
                "show"
            );


            status.textContent =
                "ERROR";


            enter.disabled=false;


            enter.textContent =
                "RETRY";
        }
    }
);


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    ()=>{

        /*
           When tab is hidden, we don't
           need to force inference.

           When visible again, the
           video-frame callback resumes.
        */

        if(
            document.hidden
        ){

            gesture.textContent =
                "PAUSED";

        }else if(
            running
        ){

            gesture.textContent =
                "SHOW YOUR HAND";
        }
    }
);

</script>
