<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hand Garden</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    cursor: crosshair;
}

#app {
    position: fixed;
    inset: 0;
    background: #050505;
}

/* CAMERA */

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0;

    transition: opacity 1.2s ease;

    filter:
        grayscale(0.25)
        contrast(1.05)
        brightness(0.7);
}

#video.active {
    opacity: 0.48;
}


/* CANVAS */

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 3;
}


/* SUBTLE VIGNETTE */

#vignette {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 4;

    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,0.55) 100%
        );
}


/* TOP LEFT */

#brand {
    position: absolute;

    top: 26px;
    left: 30px;

    z-index: 10;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 11px;

    letter-spacing: 0.22em;

    text-transform: uppercase;

    color: rgba(255,255,255,0.72);
}

#brand span {
    color: rgba(255,255,255,0.28);
}


/* TOP RIGHT */

#status {
    position: absolute;

    top: 27px;
    right: 30px;

    z-index: 10;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: 0.15em;

    color: rgba(255,255,255,0.35);

    text-transform: uppercase;
}


/* INTRO */

#intro {
    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: #050505;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#intro-title {

    font-size:
        clamp(42px, 7vw, 82px);

    font-weight: 300;

    letter-spacing:
        -0.045em;

    margin-bottom: 14px;
}

#intro-subtitle {

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: 0.24em;

    color:
        rgba(255,255,255,0.4);

    text-transform: uppercase;

    margin-bottom: 42px;
}

#start {

    appearance: none;

    border: 1px solid
        rgba(255,255,255,0.35);

    background: transparent;

    color: white;

    padding:
        13px 27px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: 0.2em;

    cursor: pointer;

    transition:
        background 0.25s ease,
        color 0.25s ease,
        border 0.25s ease;
}

#start:hover {

    background: white;

    color: black;

    border-color: white;
}


/* BOTTOM */

#hint {

    position: absolute;

    left: 50%;

    bottom: 25px;

    transform:
        translateX(-50%);

    z-index: 10;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: 0.18em;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.3);

    white-space: nowrap;
}


/* FLOWER INFO */

#flowerInfo {

    position: absolute;

    left: 30px;

    bottom: 28px;

    z-index: 10;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 0.4s ease;
}

#flowerInfo.visible {
    opacity: 1;
}

#flowerName {

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 10px;

    letter-spacing: 0.2em;

    text-transform: uppercase;
}

#flowerMeaning {

    margin-top: 5px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: 0.12em;

    color:
        rgba(255,255,255,0.4);
}


/* MOBILE */

@media (max-width: 600px) {

    #brand {
        top: 20px;
        left: 20px;
    }

    #status {
        top: 21px;
        right: 20px;
    }

    #hint {
        bottom: 18px;
    }

    #flowerInfo {
        left: 20px;
        bottom: 18px;
    }
}
</style>
</head>


<body>

<div id="app">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <div id="vignette"></div>


    <div id="brand">
        HAND <span>/</span> GARDEN
    </div>


    <div id="status">
        OFFLINE
    </div>


    <div id="hint">
        move your hand through the frame
    </div>


    <div id="flowerInfo">

        <div id="flowerName">
            ROSE
        </div>

        <div id="flowerMeaning">
            LOVE · COURAGE
        </div>

    </div>


    <div id="intro">

        <div id="intro-title">
            Hand Garden
        </div>

        <div id="intro-subtitle">
            a small experiment in gesture & memory
        </div>

        <button id="start">
            ENTER
        </button>

    </div>

</div>


<script type="module">

import {
    FilesetResolver,
    HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


/* --------------------------------
   ELEMENTS
-------------------------------- */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const intro =
    document.getElementById("intro");

const startButton =
    document.getElementById("start");

const status =
    document.getElementById("status");

const flowerInfo =
    document.getElementById("flowerInfo");

const flowerName =
    document.getElementById("flowerName");

const flowerMeaning =
    document.getElementById("flowerMeaning");


/* --------------------------------
   STATE
-------------------------------- */

let handLandmarker = null;

let lastVideoTime = -1;

let flowers = [];

let particles = [];

let lastFlower = 0;

let W = window.innerWidth;

let H = window.innerHeight;


/* --------------------------------
   FLOWER MEANINGS
-------------------------------- */

const FLOWERS = {

    one: {

        type: "rose",

        name: "ROSE",

        meaning:
            "LOVE · COURAGE"

    },

    two: {

        type: "iris",

        name: "IRIS",

        meaning:
            "INTUITION · HOPE"

    },

    three: {

        type: "cosmos",

        name: "COSMOS",

        meaning:
            "HARMONY · PEACE"

    },

    five: {

        type: "wild",

        name: "WILDFLOWER",

        meaning:
            "FREEDOM · GRATITUDE"

    }

};


/* --------------------------------
   RESIZE
-------------------------------- */

function resize() {

    W = window.innerWidth;

    H = window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* --------------------------------
   CAMERA
-------------------------------- */

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "Camera access is not supported by this browser."
        );

    }

    const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video: {

                facingMode: "user",

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                }

            },

            audio: false

        });

    video.srcObject =
        stream;

    await video.play();

    video.classList.add(
        "active"
    );
}


/* --------------------------------
   MEDIAPIPE
-------------------------------- */

async function createHandTracker() {

    const vision =
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


    handLandmarker =
        await HandLandmarker
        .createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate: "GPU"

                },

                runningMode: "VIDEO",

                numHands: 1,

                minHandDetectionConfidence:
                    0.45,

                minHandPresenceConfidence:
                    0.45,

                minTrackingConfidence:
                    0.45

            }

        );

}


/* --------------------------------
   FINGER COUNT
-------------------------------- */

function countFingers(
    lm,
    handedness
) {

    let count = 0;


    /*
        INDEX
    */

    if (
        lm[8].y <
        lm[6].y
    ) {

        count++;

    }


    /*
        MIDDLE
    */

    if (
        lm[12].y <
        lm[10].y
    ) {

        count++;

    }


    /*
        RING
    */

    if (
        lm[16].y <
        lm[14].y
    ) {

        count++;

    }


    /*
        PINKY
    */

    if (
        lm[20].y <
        lm[18].y
    ) {

        count++;

    }


    /*
        THUMB
    */

    if (
        handedness === "Right"
    ) {

        if (
            lm[4].x <
            lm[3].x
        ) {

            count++;

        }

    } else {

        if (
            lm[4].x >
            lm[3].x
        ) {

            count++;

        }

    }


    return count;
}


/* --------------------------------
   GESTURE
-------------------------------- */

function gestureFromCount(
    fingers
) {

    if (fingers === 1)
        return "one";

    if (fingers === 2)
        return "two";

    if (fingers === 3)
        return "three";

    return "five";
}


/* --------------------------------
   LANDMARK → SCREEN
-------------------------------- */

function screenPoint(
    p
) {

    return {

        x:
            (1 - p.x) * W,

        y:
            p.y * H

    };

}


/* --------------------------------
   PLANT
-------------------------------- */

function plant(
    gesture,
    point
) {

    const now =
        performance.now();


    if (
        now - lastFlower <
        650
    ) {

        return;

    }


    lastFlower =
        now;


    const data =
        FLOWERS[gesture];


    if (!data)
        return;


    flowerName.textContent =
        data.name;

    flowerMeaning.textContent =
        data.meaning;

    flowerInfo.classList.add(
        "visible"
    );


    flowers.push({

        x: point.x,

        y: point.y,

        type: data.type,

        age: 0,

        rotation:
            (
                Math.random() -
                0.5
            ) * 0.35,

        scale:
            0.85 +
            Math.random() *
            0.35

    });


    createParticles(
        point.x,
        point.y
    );


    if (
        flowers.length >
        45
    ) {

        flowers.shift();

    }
}


/* --------------------------------
   PARTICLES
-------------------------------- */

function createParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        particles.push({

            x,

            y,

            vx:
                (
                    Math.random() -
                    0.5
                ) * 1.4,

            vy:
                -Math.random() * 1.5,

            life: 1,

            size:
                1 +
                Math.random() * 2

        });

    }

}


/* --------------------------------
   GLOW
-------------------------------- */

function glow(
    x,
    y,
    radius,
    alpha
) {

    const g =
        ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            radius
        );

    g.addColorStop(
        0,
        `rgba(255,255,255,${alpha})`
    );

    g.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle = g;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* --------------------------------
   ROSE
-------------------------------- */

function drawRose(
    x,
    y,
    s,
    r
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(r);

    ctx.scale(s, s);


    /*
        glow
    */

    glow(
        0,
        0,
        65,
        0.045
    );


    /*
        stem
    */

    ctx.strokeStyle =
        "rgba(165,205,171,0.8)";

    ctx.lineWidth = 1.4;

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(
        -4,
        35,
        5,
        65,
        0,
        105
    );

    ctx.stroke();


    /*
        petals
    */

    ctx.strokeStyle =
        "rgba(255,185,207,0.9)";

    ctx.lineWidth = 1.2;


    for (
        let i = 0;
        i < 11;
        i++
    ) {

        const a =
            i *
            Math.PI *
            2 /
            11;

        const px =
            Math.cos(a) *
            20;

        const py =
            Math.sin(a) *
            20;


        ctx.beginPath();

        ctx.ellipse(
            px,
            py,
            17,
            25,
            a,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    /*
        center
    */

    ctx.fillStyle =
        "rgba(255,205,219,0.9)";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();
}


/* --------------------------------
   IRIS
-------------------------------- */

function drawIris(
    x,
    y,
    s,
    r
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(r);

    ctx.scale(s, s);


    glow(
        0,
        0,
        65,
        0.04
    );


    ctx.strokeStyle =
        "rgba(181,165,255,0.9)";

    ctx.lineWidth =
        1.3;


    /*
        stem
    */

    ctx.strokeStyle =
        "rgba(160,198,165,0.75)";

    ctx.beginPath();

    ctx.moveTo(
        0,
        5
    );

    ctx.bezierCurveTo(
        5,
        40,
        -5,
        75,
        0,
        105
    );

    ctx.stroke();


    /*
        petals
    */

    ctx.strokeStyle =
        "rgba(193,170,255,0.9)";


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const a =
            i *
            Math.PI *
            2 /
            6;

        ctx.save();

        ctx.rotate(a);

        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.bezierCurveTo(
            -25,
            -15,
            -28,
            -42,
            0,
            -48
        );

        ctx.bezierCurveTo(
            28,
            -42,
            25,
            -15,
            0,
            0
        );

        ctx.stroke();

        ctx.restore();

    }


    ctx.fillStyle =
        "rgba(235,221,255,0.9)";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();
}


/* --------------------------------
   COSMOS
-------------------------------- */

function drawCosmos(
    x,
    y,
    s,
    r
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(r);

    ctx.scale(s, s);


    glow(
        0,
        0,
        70,
        0.035
    );


    /*
        stem
    */

    ctx.strokeStyle =
        "rgba(158,203,168,0.75)";

    ctx.lineWidth =
        1.2;

    ctx.beginPath();

    ctx.moveTo(
        0,
        5
    );

    ctx.bezierCurveTo(
        -4,
        35,
        4,
        70,
        0,
        105
    );

    ctx.stroke();


    /*
        petals
    */

    ctx.strokeStyle =
        "rgba(255,208,228,0.85)";


    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const a =
            i *
            Math.PI *
            2 /
            8;

        ctx.save();

        ctx.rotate(a);

        ctx.beginPath();

        ctx.ellipse(
            0,
            -27,
            10,
            27,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();

    }


    ctx.fillStyle =
        "rgba(255,224,161,0.9)";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();
}


/* --------------------------------
   WILDFLOWER
-------------------------------- */

function drawWildflower(
    x,
    y,
    s,
    r
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(r);

    ctx.scale(s, s);


    glow(
        0,
        0,
        70,
        0.035
    );


    const colours = [
        "rgba(255,194,214,0.9)",
        "rgba(204,183,255,0.9)",
        "rgba(255,224,167,0.9)",
        "rgba(188,235,204,0.9)"
    ];


    /*
        multiple stems
    */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const offset =
            (i - 2) * 13;


        ctx.strokeStyle =
            "rgba(158,204,165,0.7)";

        ctx.lineWidth =
            1;


        ctx.beginPath();

        ctx.moveTo(
            offset,
            0
        );

        ctx.bezierCurveTo(
            offset - 4,
            35,
            offset + 5,
            65,
            offset,
            105
        );

        ctx.stroke();


        /*
            little flower
        */

        ctx.strokeStyle =
            colours[i % 4];


        for (
            let p = 0;
            p < 5;
            p++
        ) {

            const a =
                p *
                Math.PI *
                2 /
                5;


            ctx.save();

            ctx.translate(
                offset,
                0
            );

            ctx.rotate(a);

            ctx.beginPath();

            ctx.ellipse(
                0,
                -8,
                4,
                9,
                0,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();

        }

    }


    ctx.restore();
}


/* --------------------------------
   DRAW
-------------------------------- */

function drawFlowers() {

    for (
        const f of flowers
    ) {

        f.age +=
            0.018;


        const growth =
            Math.min(
                f.age * 2.5,
                1
            );


        const s =
            f.scale *
            growth;


        const sway =
            Math.sin(
                f.age * 2.5
            ) * 2;


        if (
            f.type === "rose"
        ) {

            drawRose(
                f.x,
                f.y + sway,
                s,
                f.rotation
            );

        }


        if (
            f.type === "iris"
        ) {

            drawIris(
                f.x,
                f.y + sway,
                s,
                f.rotation
            );

        }


        if (
            f.type === "cosmos"
        ) {

            drawCosmos(
                f.x,
                f.y + sway,
                s,
                f.rotation
            );

        }


        if (
            f.type === "wild"
        ) {

            drawWildflower(
                f.x,
                f.y + sway,
                s,
                f.rotation
            );

        }

    }
}


/* --------------------------------
   PARTICLES
-------------------------------- */

function drawParticles() {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += 0.008;

        p.life -= 0.014;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();

        ctx.globalAlpha =
            p.life * 0.7;

        ctx.fillStyle =
            "white";

        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            "white";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

    }
}


/* --------------------------------
   ANIMATION
-------------------------------- */

function animate() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawFlowers();

    drawParticles();


    requestAnimationFrame(
        animate
    );

}

animate();


/* --------------------------------
   DETECTION LOOP
-------------------------------- */

async function detect() {

    if (
        !handLandmarker ||
        video.readyState < 2
    ) {

        requestAnimationFrame(
            detect
        );

        return;

    }


    if (
        video.currentTime !==
        lastVideoTime
    ) {

        lastVideoTime =
            video.currentTime;


        try {

            const result =
                handLandmarker
                .detectForVideo(
                    video,
                    performance.now()
                );


            if (
                result.landmarks &&
                result.landmarks.length
            ) {

                const lm =
                    result.landmarks[0];


                let handedness =
                    "Right";


                if (
                    result.handedness &&
                    result.handedness[0] &&
                    result.handedness[0][0]
                ) {

                    handedness =
                        result.handedness[0][0]
                        .categoryName;

                }


                const fingers =
                    countFingers(
                        lm,
                        handedness
                    );


                const gesture =
                    gestureFromCount(
                        fingers
                    );


                /*
                    INDEX FINGER
                    becomes cursor
                */

                const point =
                    screenPoint(
                        lm[8]
                    );


                /*
                    Small cursor glow
                */

                ctx.save();

                ctx.fillStyle =
                    "rgba(255,255,255,0.8)";

                ctx.shadowBlur =
                    18;

                ctx.shadowColor =
                    "white";

                ctx.beginPath();

                ctx.arc(
                    point.x,
                    point.y,
                    2,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                ctx.restore();


                plant(
                    gesture,
                    point
                );

            }

        } catch (error) {

            console.error(
                "Detection error:",
                error
            );

        }

    }


    requestAnimationFrame(
        detect
    );
}

            /*

            */

            intro.classList.add(
                "hidden"
            );


            /*
                START DETECTION
            */

            detect();

                error
            );

            status.textContent =

    }
);
