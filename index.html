<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hand Garden 🌸</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 30px 0 10px;
            font-size: 42px;
        }

        #status {
            color: #aaa;
            font-size: 17px;
            min-height: 25px;
        }

        #result {
            font-size: 30px;
            margin: 15px;
        }

        .camera {
            position: relative;
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
        }

        video {
            width: 100%;
            display: block;
            border-radius: 24px;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        #debug {
            color: #666;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>🌸 Hand Garden</h1>

    <div id="status">Loading...</div>

    <div id="result">👋 Show me your hand</div>

    <div class="camera">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="debug"></div>


    <script type="module">

        import {
            FilesetResolver,
            HandLandmarker
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";


        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const debug = document.getElementById("debug");


        let handLandmarker = null;
        let lastVideoTime = -1;


        // ------------------------------------------------
        // CAMERA
        // ------------------------------------------------

        async function startCamera() {

            status.textContent = "Starting camera...";

            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    facingMode: "user"
                },
                audio: false
            });

            video.srcObject = stream;

            await video.play();

            status.textContent = "Camera ready 📷";
        }


        // ------------------------------------------------
        // MEDIAPIPE
        // ------------------------------------------------

        async function startHandTracking() {

            status.textContent = "Loading hand tracking...";


            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
            );


            handLandmarker =
                await HandLandmarker.createFromOptions(
                    vision,
                    {
                        baseOptions: {
                            modelAssetPath:
                                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                            delegate: "GPU"
                        },

                        runningMode: "VIDEO",

                        numHands: 1,

                        minHandDetectionConfidence: 0.5,

                        minHandPresenceConfidence: 0.5,

                        minTrackingConfidence: 0.5
                    }
                );


            status.textContent = "Hand tracking ready ✨";

            resizeCanvas();

            detectHands();
        }


        // ------------------------------------------------
        // CANVAS
        // ------------------------------------------------

        function resizeCanvas() {

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        }


        // ------------------------------------------------
        // DETECT HAND
        // ------------------------------------------------

        function detectHands() {

            if (
                handLandmarker &&
                video.readyState >= 2 &&
                video.currentTime !== lastVideoTime
            ) {

                lastVideoTime = video.currentTime;


                const detection =
                    handLandmarker.detectForVideo(
                        video,
                        performance.now()
                    );


                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                if (detection.landmarks.length > 0) {

                    const landmarks =
                        detection.landmarks[0];

                    result.textContent =
                        "✋ Hand detected!";

                    debug.textContent =
                        "Tracking hand landmarks...";


                    // Draw hand points
                    for (const point of landmarks) {

                        const x =
                            point.x * canvas.width;

                        const y =
                            point.y * canvas.height;


                        ctx.beginPath();

                        ctx.arc(
                            x,
                            y,
                            5,
                            0,
                            Math.PI * 2
                        );

                        ctx.fillStyle = "#ffffff";

                        ctx.fill();
                    }


                    // Highlight index finger
                    const indexFinger =
                        landmarks[8];

                    const ix =
                        indexFinger.x * canvas.width;

                    const iy =
                        indexFinger.y * canvas.height;


                    ctx.beginPath();

                    ctx.arc(
                        ix,
                        iy,
                        18,
                        0,
                        Math.PI * 2
                    );

                    ctx.strokeStyle = "#ffffff";

                    ctx.lineWidth = 3;

                    ctx.stroke();

                } else {

                    result.textContent =
                        "👋 Show me your hand";

                    debug.textContent =
                        "No hand detected";
                }
            }


            requestAnimationFrame(detectHands);
        }


        // ------------------------------------------------
        // START
        // ------------------------------------------------

        async function start() {

            try {

                await startCamera();

                await startHandTracking();

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Something went wrong 😭";

                result.textContent =
                    "Open Console for details";

                debug.textContent =
                    error.message;
            }
        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        start();

    </script>

</body>

</html>
