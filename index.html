<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hand Garden 🌸</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        #status {
            color: #aaa;
            font-size: 18px;
        }

        #result {
            font-size: 30px;
            margin: 20px;
        }

        video {
            width: 90%;
            max-width: 700px;
            border-radius: 20px;
            transform: scaleX(-1);
        }
    </style>
</head>

<body>

    <h1>🌸 Hand Garden</h1>

    <p id="status">Starting camera...</p>

    <div id="result">👋 Show me your hand</div>

    <video id="video" autoplay playsinline></video>


    <script type="module">

        import {
            HandLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1";


        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const result = document.getElementById("result");


        async function start() {

            try {

                // CAMERA
                status.textContent = "Starting camera...";

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true
                    });

                video.srcObject = stream;


                // MEDIAPIPE
                status.textContent = "Loading hand tracking...";


                const vision =
                    await FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
                    );


                const handLandmarker =
                    await HandLandmarker.createFromOptions(
                        vision,
                        {
                            baseOptions: {
                                modelAssetPath:
                                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
                            },

                            runningMode: "VIDEO",

                            numHands: 1
                        }
                    );


                status.textContent = "Hand tracking ready ✨";


                function detect() {

                    if (video.readyState >= 2) {

                        const hands =
                            handLandmarker.detectForVideo(
                                video,
                                performance.now()
                            );


                        if (hands.landmarks.length > 0) {

                            result.textContent =
                                "✋ Hand detected!";

                        } else {

                            result.textContent =
                                "👋 Show me your hand";

                        }

                    }

                    requestAnimationFrame(detect);
                }


                detect();


            } catch (error) {

                console.error(error);

                status.textContent =
                    "ERROR: " + error.message;

            }

        }


        start();

    </script>

</body>

</html>
