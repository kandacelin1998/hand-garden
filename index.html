<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HAND / GARDEN</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    opacity:0;
    transition:opacity 1s ease;
    filter:
        brightness(1.12)
        contrast(.92)
        saturate(1.08)
        blur(.35px);
    z-index:1;
}

#video.live{opacity:1}

#beautyGlow{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.11) 0%,
            rgba(255,255,255,.035) 42%,
            rgba(255,255,255,0) 72%
        );
    mix-blend-mode:screen;
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:4;
    pointer-events:none;
}

#shade{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 35%,
            rgba(0,0,0,.25) 100%
        );
}

#top{
    position:fixed;
    top:25px;
    left:28px;
    right:28px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:9px;
    letter-spacing:.25em;
    color:rgba(255,255,255,.62);
}

.dim{color:rgba(255,255,255,.22)}

#info{
    position:fixed;
    left:28px;
    bottom:27px;
    z-index:20;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .6s ease,transform .6s ease;
    pointer-events:none;
}

#info.show{
    opacity:1;
    transform:translateY(0);
}

#flower{
    font-family:Georgia,"Times New Roman",serif;
    font-size:27px;
    letter-spacing:-.025em;
}

#meaning{
    margin-top:6px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:8px;
    letter-spacing:.23em;
    color:rgba(255,255,255,.42);
}

#gesture{
    position:fixed;
    right:28px;
    bottom:28px;
    z-index:20;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:8px;
    letter-spacing:.2em;
    color:rgba(255,255,255,.32);
}

#intro{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#000;
    transition:opacity .8s ease;
}

#intro.hide{
    opacity:0;
    pointer-events:none;
}

#title{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    font-size:clamp(52px,9vw,120px);
    line-height:.85;
    letter-spacing:-.055em;
}

#subtitle{
    margin-top:20px;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:8px;
    letter-spacing:.35em;
    color:rgba(255,255,255,.3);
    text-transform:uppercase;
}

#enter{
    margin-top:48px;
    padding:13px 30px;
    border:1px solid rgba(255,255,255,.3);
    background:transparent;
    color:white;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:8px;
    letter-spacing:.25em;
    cursor:pointer;
    transition:background .25s ease,color .25s ease,border .25s ease;
}

#enter:hover{
    background:white;
    color:black;
    border-color:white;
}

#enter:disabled{
    opacity:.5;
    cursor:wait;
}

#loading{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:60;
    display:none;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:9px;
    letter-spacing:.2em;
    color:rgba(255,255,255,.55);
}

#loading.show{display:block}

#error{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:100;
    width:360px;
    max-width:85vw;
    text-align:center;
    display:none;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:9px;
    line-height:1.8;
    color:rgba(255,255,255,.45);
}

#error.show{display:block}

#error strong{
    display:block;
    margin-bottom:12px;
    color:white;
    letter-spacing:.2em;
}

@media(max-width:600px){
    #top{left:18px;right:18px;top:18px}
    #info{left:18px;bottom:20px}
    #gesture{right:18px;bottom:20px}
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline></video>
<div id="beautyGlow"></div>
<canvas id="canvas"></canvas>
<div id="shade"></div>

<div id="top">
    <div>HAND <span class="dim">/</span> GARDEN</div>
    <div id="status">OFFLINE</div>
</div>

<div id="info">
    <div id="flower">Rose</div>
    <div id="meaning">LOVE · COURAGE</div>
</div>

<div id="gesture">SHOW YOUR HAND</div>

<div id="intro">
    <h1 id="title">Hand Garden</h1>
    <div id="subtitle">A gesture becomes a flower</div>
    <button id="enter">ENTER</button>
</div>

<div id="loading">INITIALISING</div>

<div id="error">
    <strong>CAMERA UNAVAILABLE</strong>
    Please allow camera access and reload the page.
</div>


<script type="module">

import {
    FilesetResolver,
    HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";


/* =====================================================
   ELEMENTS
===================================================== */

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const intro=document.getElementById("intro");
const enter=document.getElementById("enter");
const loading=document.getElementById("loading");
const errorBox=document.getElementById("error");
const status=document.getElementById("status");
const info=document.getElementById("info");
const flower=document.getElementById("flower");
const meaning=document.getElementById("meaning");
const gesture=document.getElementById("gesture");


/* =====================================================
   CANVAS
===================================================== */

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    const dpr=Math.min(devicePixelRatio||1,2);

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
addEventListener("resize",resize);


/* =====================================================
   STATE
===================================================== */

let handLandmarker=null;
let lastVideoTime=-1;

let candidateGesture=null;
let candidateFrames=0;
let confirmedGesture=null;

let lastPlant=0;

const plants=[];
const particles=[];


/* =====================================================
   FLOWERS
===================================================== */

const FLOWERS={

    1:{
        name:"Rose",
        meaning:"LOVE · COURAGE",
        type:"rose"
    },

    2:{
        name:"Tulip",
        meaning:"NEW BEGINNINGS",
        type:"tulip"
    },

    3:{
        name:"Sunflower",
        meaning:"JOY · POSITIVITY",
        type:"sunflower"
    },

    4:{
        name:"Peony",
        meaning:"PROSPERITY · BEAUTY",
        type:"peony"
    },

    5:{
        name:"Wildflower",
        meaning:"FREEDOM · GRATITUDE",
        type:"wild"
    }
};


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

    if(!navigator.mediaDevices?.getUserMedia){
        throw new Error("Camera API unavailable");
    }

    const stream=await navigator.mediaDevices.getUserMedia({

        video:{
            facingMode:"user",
            width:{ideal:1920},
            height:{ideal:1080},
            frameRate:{ideal:30}
        },

        audio:false
    });

    video.srcObject=stream;

    await new Promise(resolve=>{
        video.onloadedmetadata=resolve;
    });

    await video.play();

    video.classList.add("live");
}


/* =====================================================
   MEDIAPIPE
===================================================== */

async function createTracker(){

    const vision=await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
    );

    handLandmarker=await HandLandmarker.createFromOptions(
        vision,
        {
            baseOptions:{
                modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                delegate:"GPU"
            },

            runningMode:"VIDEO",
            numHands:1,

            minHandDetectionConfidence:.45,
            minHandPresenceConfidence:.45,
            minTrackingConfidence:.45
        }
    );
}


/* =====================================================
   MATH
===================================================== */

function dist(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function angle(a,b,c){

    const ab={
        x:a.x-b.x,
        y:a.y-b.y
    };

    const cb={
        x:c.x-b.x,
        y:c.y-b.y
    };

    const dot=
        ab.x*cb.x+
        ab.y*cb.y;

    const mag=
        Math.hypot(ab.x,ab.y)*
        Math.hypot(cb.x,cb.y);

    if(!mag) return 0;

    return Math.acos(
        Math.max(-1,Math.min(1,dot/mag))
    )*180/Math.PI;
}


/* =====================================================
   FINGER ANALYSIS
===================================================== */

/*
   MediaPipe indices:

   Thumb:
   1 2 3 4

   Index:
   5 6 7 8

   Middle:
   9 10 11 12

   Ring:
   13 14 15 16

   Pinky:
   17 18 19 20
*/


function fingerIsOpen(lm,mcp,pip,dip,tip){

    const a=angle(
        lm[mcp],
        lm[pip],
        lm[dip]
    );

    const b=angle(
        lm[pip],
        lm[dip],
        lm[tip]
    );

    const straight=
        a>150 &&
        b>145;

    const extension=
        dist(lm[tip],lm[mcp]) >
        dist(lm[dip],lm[mcp])*1.12;

    return straight && extension;
}


/* =====================================================
   THUMB
===================================================== */

function thumbIsOpen(lm){

    const angleAtIP=angle(
        lm[2],
        lm[3],
        lm[4]
    );

    const palmWidth=
        dist(lm[5],lm[17]);

    const thumbDistance=
        dist(lm[4],lm[5]);

    /*
       Thumb must be genuinely
       away from the palm.
    */

    return(
        angleAtIP>135 &&
        thumbDistance>palmWidth*.55
    );
}


/* =====================================================
   PALM OPEN TEST
===================================================== */

function isOpenPalm(lm,fingers){

    if(fingers!==5) return false;

    const palmCenter={
        x:
            (
                lm[0].x+
                lm[5].x+
                lm[9].x+
                lm[13].x+
                lm[17].x
            )/5,

        y:
            (
                lm[0].y+
                lm[5].y+
                lm[9].y+
                lm[13].y+
                lm[17].y
            )/5
    };


    const tips=[
        4,
        8,
        12,
        16,
        20
    ];


    const avgTipDistance=
        tips.reduce(
            (sum,i)=>
                sum+
                dist(
                    lm[i],
                    palmCenter
                ),
            0
        )/5;


    const palmWidth=
        dist(lm[5],lm[17]);


    /*
       Open palm should have
       fingertips clearly away
       from the palm.
    */

    return(
        avgTipDistance>
        palmWidth*.92
    );
}


/* =====================================================
   COUNT
===================================================== */

function detectFingerCount(lm){

    const index=fingerIsOpen(
        lm,5,6,7,8
    );

    const middle=fingerIsOpen(
        lm,9,10,11,12
    );

    const ring=fingerIsOpen(
        lm,13,14,15,16
    );

    const pinky=fingerIsOpen(
        lm,17,18,19,20
    );

    const thumb=thumbIsOpen(lm);


    /*
       Return individual states
       because 4/5 needs special handling.
    */

    const states=[
        thumb,
        index,
        middle,
        ring,
        pinky
    ];

    let count=
        states.filter(Boolean).length;


    /*
       If all four long fingers are
       clearly open, treat thumb as
       open if it is reasonably away
       from the palm.
    */

    if(
        index &&
        middle &&
        ring &&
        pinky
    ){

        const palmWidth=
            dist(lm[5],lm[17]);

        const thumbSpread=
            dist(lm[4],lm[5])/
            palmWidth;

        if(thumbSpread>.42){
            count=5;
        }
        else{
            count=4;
        }
    }


    /*
       If four fingers are open and
       thumb is folded, definitely 4.
    */

    if(
        index &&
        middle &&
        ring &&
        pinky &&
        !thumb
    ){

        count=4;
    }


    return count;
}


/* =====================================================
   GESTURE STABILISER
===================================================== */

function stabilize(count){

    if(!FLOWERS[count]){
        return confirmedGesture;
    }


    if(count===candidateGesture){

        candidateFrames++;

    }else{

        candidateGesture=count;
        candidateFrames=1;

    }


    /*
       Need about 6 consistent frames.
       This prevents jitter.
    */

    if(candidateFrames>=6){

        confirmedGesture=count;

    }


    return confirmedGesture;
}


/* =====================================================
   POSITION
===================================================== */

function screenPosition(p){

    return{
        x:(1-p.x)*W,
        y:p.y*H
    };
}


/* =====================================================
   PLANT
===================================================== */

function plant(type,p){

    const now=performance.now();

    if(now-lastPlant<850){
        return;
    }

    lastPlant=now;

    plants.push({

        x:p.x,
        y:p.y,

        type,

        scale:.72+
            Math.random()*.38,

        rotation:
            (Math.random()-.5)*.25,

        age:0

    });


    if(plants.length>32){
        plants.shift();
    }


    for(let i=0;i<25;i++){

        particles.push({

            x:p.x,
            y:p.y,

            vx:
                (Math.random()-.5)*1.7,

            vy:
                (Math.random()-.9)*1.6,

            size:
                .5+
                Math.random()*1.8,

            life:1
        });
    }
}


/* =====================================================
   STEM
===================================================== */

function stem(length=110){

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.bezierCurveTo(
        9,length*.3,
        -8,length*.7,
        0,length
    );

    ctx.stroke();
}


function petal(
    x,y,rx,ry,rotation
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(rotation);

    ctx.beginPath();

    ctx.ellipse(
        0,0,
        rx,ry,
        0,0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   ROSE
===================================================== */

function drawRose(x,y,s,r){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(r);
    ctx.scale(s,s);

    ctx.strokeStyle=
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;

    stem(115);

    ctx.shadowBlur=15;
    ctx.shadowColor=
        "rgba(255,155,200,.45)";

    ctx.strokeStyle=
        "rgba(255,170,205,.9)";

    for(let layer=0;layer<3;layer++){

        const radius=9+layer*6;
        const n=7+layer*2;

        for(let i=0;i<n;i++){

            petal(
                0,
                -radius,
                9-layer,
                17-layer*2,
                i*Math.PI*2/n
            );
        }
    }

    ctx.restore();
}


/* =====================================================
   TULIP
===================================================== */

function drawTulip(x,y,s,r){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(r);
    ctx.scale(s,s);

    ctx.strokeStyle=
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;

    stem(112);

    ctx.shadowBlur=18;
    ctx.shadowColor=
        "rgba(255,170,205,.5)";

    ctx.strokeStyle=
        "rgba(255,180,211,.92)";

    ctx.beginPath();

    ctx.moveTo(-28,-5);

    ctx.bezierCurveTo(
        -30,-34,
        -17,-46,
        -7,-25
    );

    ctx.bezierCurveTo(
        -2,-49,
        5,-51,
        13,-26
    );

    ctx.bezierCurveTo(
        23,-46,
        31,-31,
        28,-5
    );

    ctx.bezierCurveTo(
        20,18,
        -20,18,
        -28,-5
    );

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   SUNFLOWER
===================================================== */

function drawSunflower(x,y,s,r){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(r);
    ctx.scale(s,s);

    ctx.strokeStyle=
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;

    stem(112);

    ctx.shadowBlur=16;
    ctx.shadowColor=
        "rgba(255,220,120,.45)";

    ctx.strokeStyle=
        "rgba(255,218,128,.95)";

    const n=20;

    for(let i=0;i<n;i++){

        ctx.save();

        ctx.rotate(i*Math.PI*2/n);

        petal(
            0,-25,
            7,23,0
        );

        ctx.restore();
    }

    ctx.shadowBlur=10;

    ctx.fillStyle=
        "rgba(222,176,92,.95)";

    ctx.beginPath();

    ctx.arc(
        0,0,8,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =====================================================
   PEONY
===================================================== */

function drawPeony(x,y,s,r){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(r);
    ctx.scale(s,s);

    ctx.strokeStyle=
        "rgba(126,181,141,.75)";

    ctx.lineWidth=1;

    stem(112);

    ctx.shadowBlur=22;
    ctx.shadowColor=
        "rgba(232,177,230,.55)";

    ctx.strokeStyle=
        "rgba(239,192,230,.92)";

    for(let ring=0;ring<4;ring++){

        const n=8+ring*2;
        const radius=8+ring*5;

        for(let i=0;i<n;i++){

            ctx.save();

            ctx.rotate(i*Math.PI*2/n);

            petal(
                0,
                -radius,
                10-ring,
                17-ring*2,
                0
            );

            ctx.restore();
        }
    }

    ctx.fillStyle=
        "rgba(255,220,243,.8)";

    ctx.beginPath();

    ctx.arc(
        0,0,4,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =====================================================
   WILDFLOWER
===================================================== */

function drawWild(x,y,s,r){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(r);
    ctx.scale(s,s);

    const colors=[
        "rgba(255,183,215,.92)",
        "rgba(199,185,255,.92)",
        "rgba(255,222,153,.92)",
        "rgba(183,232,201,.92)",
        "rgba(240,198,255,.92)"
    ];

    for(let i=0;i<5;i++){

        const dx=(i-2)*14;

        ctx.strokeStyle=
            "rgba(126,181,141,.65)";

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.quadraticCurveTo(
            dx*.3,50,
            dx,110
        );

        ctx.stroke();

        ctx.shadowBlur=13;
        ctx.shadowColor=colors[i];

        ctx.strokeStyle=colors[i];

        for(let p=0;p<6;p++){

            ctx.save();

            ctx.translate(dx,-25);

            ctx.rotate(p*Math.PI*2/6);

            petal(
                0,-8,
                4,10,0
            );

            ctx.restore();
        }
    }

    ctx.restore();
}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    ctx.clearRect(0,0,W,H);


    for(const p of plants){

        p.age+=.026;

        const growth=Math.min(p.age,1);

        const scale=p.scale*growth;


        if(p.type==="rose")
            drawRose(
                p.x,p.y,
                scale,p.rotation
            );

        if(p.type==="tulip")
            drawTulip(
                p.x,p.y,
                scale,p.rotation
            );

        if(p.type==="sunflower")
            drawSunflower(
                p.x,p.y,
                scale,p.rotation
            );

        if(p.type==="peony")
            drawPeony(
                p.x,p.y,
                scale,p.rotation
            );

        if(p.type==="wild")
            drawWild(
                p.x,p.y,
                scale,p.rotation
            );
    }


    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.012;
        p.life-=.014;

        if(p.life<=0){

            particles.splice(i,1);
            continue;
        }

        ctx.save();

        ctx.globalAlpha=p.life*.7;

        ctx.fillStyle="white";

        ctx.shadowBlur=14;
        ctx.shadowColor="white";

        ctx.beginPath();

        ctx.arc(
            p.x,p.y,
            p.size,
            0,Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }


    requestAnimationFrame(animate);
}

animate();


/* =====================================================
   DETECTION LOOP
===================================================== */

async function detectHands(){

    if(
        !handLandmarker ||
        video.readyState<2
    ){

        requestAnimationFrame(detectHands);
        return;
    }


    if(
        video.currentTime!==
        lastVideoTime
    ){

        lastVideoTime=
            video.currentTime;


        try{

            const result=
                handLandmarker.detectForVideo(
                    video,
                    performance.now()
                );


            if(
                result.landmarks &&
                result.landmarks.length
            ){

                const lm=
                    result.landmarks[0];


                const rawCount=
                    detectFingerCount(lm);


                const stable=
                    stabilize(rawCount);


                if(stable){

                    const data=
                        FLOWERS[stable];


                    flower.textContent=
                        data.name;

                    meaning.textContent=
                        data.meaning;

                    info.classList.add("show");


                    gesture.textContent=
                        stable+
                        " FINGER"+
                        (stable===1?"":"S")+
                        " · "+
                        data.name;


                    const point=
                        screenPosition(lm[8]);


                    plant(
                        data.type,
                        point
                    );
                }

            }else{

                candidateGesture=null;
                candidateFrames=0;
                confirmedGesture=null;

                info.classList.remove("show");

                gesture.textContent=
                    "SHOW YOUR HAND";
            }

        }catch(err){

            console.error(
                "HAND TRACKING ERROR:",
                err
            );
        }
    }


    requestAnimationFrame(detectHands);
}


/* =====================================================
   ENTER
===================================================== */

enter.addEventListener(
    "click",
    async()=>{

        enter.disabled=true;
        enter.textContent="STARTING";

        loading.classList.add("show");


        try{

            status.textContent="CAMERA";

            await openCamera();


            status.textContent="TRACKER";

            await createTracker();


            loading.classList.remove("show");

            intro.classList.add("hide");

            status.textContent="LIVE";


            detectHands();


        }catch(err){

            console.error(
                "HAND GARDEN ERROR:",
                err
            );

            loading.classList.remove("show");

            errorBox.classList.add("show");

            status.textContent="ERROR";

            enter.disabled=false;
            enter.textContent="RETRY";
        }
    }
);

</script>
