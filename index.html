<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAND / GARDEN</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #000;
}

/* CAMERA */

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0;

    transition: opacity .8s ease;

    filter:
        brightness(.38)
        contrast(1.18)
        saturate(.45);

    z-index: 1;
}

#video.live {
    opacity: 1;
}

/* CANVAS */

#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 3;

    pointer-events: none;
}

/* DARK OVERLAY */

#shade {
    position: fixed;
    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 15%,
            rgba(0,0,0,.45) 100%
        );
}

/* TOP UI */

#top {
    position: fixed;

    top: 25px;
    left: 28px;
    right: 28px;

    z-index: 10;

    display: flex;
    justify-content: space-between;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: .25em;

    color: rgba(255,255,255,.55);
}

.dim {
    color: rgba(255,255,255,.2);
}

/* BOTTOM INFO */

#info {
    position: fixed;

    left: 28px;
    bottom: 27px;

    z-index: 10;

    opacity: 0;

    transform: translateY(8px);

    transition:
        opacity .5s ease,
        transform .5s ease;
}

#info.show {
    opacity: 1;
    transform: translateY(0);
}

#flower {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 25px;

    letter-spacing: -.02em;
}

#meaning {
    margin-top: 5px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .22em;

    color: rgba(255,255,255,.35);
}

#gesture {
    position: fixed;

    right: 28px;
    bottom: 28px;

    z-index: 10;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .2em;

    color: rgba(255,255,255,.28);
}

/* INTRO */

#intro {
    position: fixed;
    inset: 0;

    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: #000;

    transition:
        opacity .8s ease;
}

#intro.hide {
    opacity: 0;
    pointer-events: none;
}

#title {
    margin: 0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight: 400;

    font-size:
        clamp(52px, 9vw, 120px);

    line-height: .85;

    letter-spacing: -.055em;
}

#subtitle {
    margin-top: 20px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .35em;

    color: rgba(255,255,255,.3);

    text-transform: uppercase;
}

#enter {
    margin-top: 48px;

    padding: 13px 30px;

    border: 1px solid rgba(255,255,255,.3);

    background: transparent;

    color: white;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .25em;

    cursor: pointer;

    transition:
        background .25s ease,
        color .25s ease,
        border .25s ease;
}

#enter:hover {
    background: white;
    color: black;
    border-color: white;
}

#enter:disabled {
    opacity: .5;
    cursor: wait;
}

/* LOADING */

#loading {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 60;

    display: none;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: .2em;

    color: rgba(255,255,255,.55);
}

#loading.show {
    display: block;
}

/* ERROR */

#error {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 100;

    width: 360px;

    max-width: 85vw;

    text-align: center;

    display: none;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    line-height: 1.8;

    color: rgba(255,255,255,.45);
}

#error.show {
    display: block;
}

#error strong {
    display: block;

    margin-bottom: 12px;

    color: white;

    letter-spacing: .2em;
}

@media(max-width:600px) {

    #top {
        left: 18px;
        right: 18px;
        top: 18px;
    }

    #info {
        left: 18px;
        bottom: 20px;
    }

    #gesture {
        right: 18px;
        bottom: 20px;
    }

}

</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="canvas"></canvas>

<div id="shade"></div>


<div id="top">

    <div>
        HAND <span class="dim">/</span> GARDEN
    </div>

    <div id="status">
        OFFLINE
    </div>

</div>


<div id="info">

    <div id="flower">
        Rose
    </div>

    <div id="meaning">
        LOVE · COURAGE
    </div>

</div>


<div id="gesture">
    SHOW YOUR HAND
</div>


<div id="intro">

    <h1 id="title">
        Hand Garden
    </h1>

    <div id="subtitle">
        A gesture becomes a flower
    </div>

    <button id="enter">
        ENTER
    </button>

</div>


<div id="loading">
    INITIALISING
</div>


<div id="error">

    <strong>CAMERA UNAVAILABLE</strong>

    Please allow camera access and reload the page.

</div>


<!-- ======================================================
     MEDIA PIPE
     Official CDN format
====================================================== -->

<script type="module">

import {
    FilesetResolver,
    HandLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";


/* ======================================================
   ELEMENTS
====================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const intro =
    document.getElementById("intro");

const enter =
    document.getElementById("enter");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");

const flower =
    document.getElementById("flower");

const meaning =
    document.getElementById("meaning");

const gesture =
    document.getElementById("gesture");


/* ======================================================
   CANVAS
====================================================== */

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* ======================================================
   STATE
====================================================== */

let handLandmarker = null;

let lastVideoTime = -1;

let lastGesture = null;

let lastPlant = 0;

const plants = [];

const particles = [];


/* ======================================================
   FLOWER MEANINGS
====================================================== */

const FLOWERS = {

    1: {
        name: "Rose",
        meaning: "LOVE · COURAGE",
        type: "rose"
    },

    2: {
        name: "Tulip",
        meaning: "NEW BEGINNINGS",
        type: "tulip"
    },

    3: {
        name: "Sunflower",
        meaning: "JOY · POSITIVITY",
        type: "sunflower"
    },

    5: {
        name: "Wildflower",
        meaning: "FREEDOM · GRATITUDE",
        type: "wild"
    }

};


/* ======================================================
   CAMERA
====================================================== */

async function openCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "Camera API unavailable"
        );

    }

    const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video: {
                facingMode: "user",

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                }
            },

            audio: false

        });


    video.srcObject =
        stream;


    await new Promise(
        resolve => {

            video.onloadedmetadata =
                resolve;

        }
    );


    await video.play();


    video.classList.add(
        "live"
    );

}


/* ======================================================
   MEDIAPIPE
====================================================== */

async function createTracker() {

    const vision =
        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"

        );


    handLandmarker =
        await HandLandmarker
        .createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate:
                        "GPU"

                },

                runningMode:
                    "VIDEO",

                numHands:
                    1,

                minHandDetectionConfidence:
                    0.5,

                minHandPresenceConfidence:
                    0.5,

                minTrackingConfidence:
                    0.5

            }

        );

}


/* ======================================================
   FINGER COUNT
====================================================== */

function countFingers(lm) {

    let count = 0;


    /*
       INDEX
    */

    if (
        lm[8].y <
        lm[6].y
    ) {

        count++;

    }


    /*
       MIDDLE
    */

    if (
        lm[12].y <
        lm[10].y
    ) {

        count++;

    }


    /*
       RING
    */

    if (
        lm[16].y <
        lm[14].y
    ) {

        count++;

    }


    /*
       PINKY
    */

    if (
        lm[20].y <
        lm[18].y
    ) {

        count++;

    }


    /*
       THUMB
    */

    const thumbTip =
        lm[4];

    const thumbBase =
        lm[2];


    const distance =
        Math.hypot(

            thumbTip.x -
            thumbBase.x,

            thumbTip.y -
            thumbBase.y

        );


    if (
        distance > 0.18
    ) {

        count++;

    }


    return count;

}


/* ======================================================
   POSITION
====================================================== */

function screenPosition(p) {

    return {

        x:
            (1 - p.x) * W,

        y:
            p.y * H

    };

}


/* ======================================================
   PLANT
====================================================== */

function plant(type, p) {

    const now =
        performance.now();


    if (
        now - lastPlant <
        900
    ) {

        return;

    }


    lastPlant =
        now;


    plants.push({

        x: p.x,

        y: p.y,

        type: type,

        scale:
            0.65 +
            Math.random() * 0.4,

        rotation:
            (
                Math.random() -
                0.5
            ) * 0.3,

        age: 0

    });


    if (
        plants.length >
        35
    ) {

        plants.shift();

    }


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        particles.push({

            x: p.x,

            y: p.y,

            vx:
                (
                    Math.random() -
                    0.5
                ) * 2,

            vy:
                (
                    Math.random() -
                    0.7
                ) * 2,

            life: 1

        });

    }

}


/* ======================================================
   STEM
====================================================== */

function drawStem(
    length = 110
) {

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(

        7,
        length * .3,

        -7,
        length * .7,

        0,
        length

    );

    ctx.stroke();

}


/* ======================================================
   ROSE
====================================================== */

function drawRose(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    ctx.strokeStyle =
        "rgba(145,190,151,.8)";

    ctx.lineWidth =
        1.1;

    drawStem();


    ctx.strokeStyle =
        "rgba(255,166,199,.95)";


    for (
        let i = 0;
        i < 11;
        i++
    ) {

        ctx.save();

        ctx.rotate(
            i *
            Math.PI *
            2 /
            11
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            -22,
            12,
            22,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();

    }


    ctx.restore();

}


/* ======================================================
   TULIP
====================================================== */

function drawTulip(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    ctx.strokeStyle =
        "rgba(145,190,151,.8)";

    ctx.lineWidth =
        1.1;

    drawStem();


    ctx.strokeStyle =
        "rgba(248,172,201,.95)";

    ctx.lineWidth =
        1.2;


    ctx.beginPath();

    ctx.moveTo(
        -27,
        -4
    );

    ctx.bezierCurveTo(
        -28,
        -33,
        -17,
        -44,
        -8,
        -25
    );

    ctx.bezierCurveTo(
        0,
        -51,
        8,
        -51,
        15,
        -25
    );

    ctx.bezierCurveTo(
        24,
        -43,
        29,
        -29,
        27,
        -4
    );

    ctx.bezierCurveTo(
        18,
        16,
        -19,
        16,
        -27,
        -4
    );

    ctx.stroke();


    ctx.restore();

}


/* ======================================================
   SUNFLOWER
====================================================== */

function drawSunflower(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    ctx.strokeStyle =
        "rgba(145,190,151,.8)";

    ctx.lineWidth =
        1.1;

    drawStem();


    ctx.strokeStyle =
        "rgba(248,210,117,.95)";


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        ctx.save();

        ctx.rotate(
            i *
            Math.PI *
            2 /
            18
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            -27,
            7,
            23,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();

    }


    ctx.fillStyle =
        "rgba(220,171,80,.95)";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* ======================================================
   WILDFLOWERS
====================================================== */

function drawWild(
    x,
    y,
    scale,
    rotation
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        rotation
    );

    ctx.scale(
        scale,
        scale
    );


    const colors = [

        "rgba(255,184,211,.95)",

        "rgba(194,181,255,.95)",

        "rgba(255,220,150,.95)",

        "rgba(183,228,198,.95)",

        "rgba(240,194,255,.95)"

    ];


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const dx =
            (i - 2) * 14;


        ctx.strokeStyle =
            "rgba(145,190,151,.72)";

        ctx.lineWidth =
            .9;


        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.quadraticCurveTo(
            dx * .3,
            50,
            dx,
            110
        );

        ctx.stroke();


        ctx.strokeStyle =
            colors[i];


        for (
            let p = 0;
            p < 6;
            p++
        ) {

            ctx.save();

            ctx.translate(
                dx,
                -25
            );

            ctx.rotate(
                p *
                Math.PI *
                2 /
                6
            );

            ctx.beginPath();

            ctx.ellipse(
                0,
                -8,
                4,
                10,
                0,
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();

        }

    }


    ctx.restore();

}


/* ======================================================
   ANIMATION
====================================================== */

function animate() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    for (
        const p of plants
    ) {

        p.age +=
            0.025;


        const growth =
            Math.min(
                p.age,
                1
            );


        const scale =
            p.scale *
            growth;


        if (
            p.type === "rose"
        ) {

            drawRose(
                p.x,
                p.y,
                scale,
                p.rotation
            );

        }


        if (
            p.type === "tulip"
        ) {

            drawTulip(
                p.x,
                p.y,
                scale,
                p.rotation
            );

        }


        if (
            p.type === "sunflower"
        ) {

            drawSunflower(
                p.x,
                p.y,
                scale,
                p.rotation
            );

        }


        if (
            p.type === "wild"
        ) {

            drawWild(
                p.x,
                p.y,
                scale,
                p.rotation
            );

        }

    }


    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            .015;

        p.life -=
            .018;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            "#fff";

        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            "#fff";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            1.2,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();

    }


    requestAnimationFrame(
        animate
    );

}

animate();


/* ======================================================
   DETECT HAND
====================================================== */

async function detectHands() {

    if (
        !handLandmarker ||
        video.readyState < 2
    ) {

        requestAnimationFrame(
            detectHands
        );

        return;

    }


    if (
        video.currentTime !==
        lastVideoTime
    ) {

        lastVideoTime =
            video.currentTime;


        try {

            const result =
                handLandmarker
                .detectForVideo(

                    video,

                    performance.now()

                );


            if (
                result.landmarks &&
                result.landmarks.length
            ) {

                const lm =
                    result.landmarks[0];


                const fingers =
                    countFingers(lm);


                const data =
                    FLOWERS[fingers];


                if (data) {

                    if (
                        lastGesture !==
                        fingers
                    ) {

                        lastGesture =
                            fingers;


                        flower.textContent =
                            data.name;

                        meaning.textContent =
                            data.meaning;

                        info.classList.add(
                            "show"
                        );

                    }


                    gesture.textContent =
                        "GESTURE DETECTED";


                    const point =
                        screenPosition(
                            lm[8]
                        );


                    plant(
                        data.type,
                        point
                    );

                }

            }
            else {

                lastGesture =
                    null;

                gesture.textContent =
                    "SHOW YOUR HAND";

            }

        }
        catch (err) {

            console.error(
                "HAND TRACKING ERROR",
                err
            );

        }

    }


    requestAnimationFrame(
        detectHands
    );

}


/* ======================================================
   ENTER
====================================================== */

enter.addEventListener(
    "click",

    async () => {

        console.log(
            "HAND GARDEN: ENTER"
        );


        enter.disabled =
            true;

        enter.textContent =
            "STARTING";


        loading.classList.add(
            "show"
        );


        try {

            /* CAMERA */

            status.textContent =
                "CAMERA";


            await openCamera();


            /* MEDIAPIPE */

            status.textContent =
                "TRACKER";


            await createTracker();


            /* READY */

            loading.classList.remove(
                "show"
            );


            intro.classList.add(
                "hide"
            );


            status.textContent =
                "LIVE";


            detectHands();


        }
        catch (err) {

            console.error(
                "HAND GARDEN ERROR:",
                err
            );


            loading.classList.remove(
                "show"
            );


            errorBox.classList.add(
                "show"
            );


            status.textContent =
                "ERROR";


            enter.disabled =
                false;

            enter.textContent =
                "RETRY";

        }

    }

);

</script>

</body>
</html>
