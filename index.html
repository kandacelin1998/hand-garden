<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAND / GARDEN</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #000;
}


/* CAMERA */

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: 0;

    transition: opacity 0.8s ease;

    filter:
        brightness(0.42)
        contrast(1.15)
        saturate(0.55);

    z-index: 1;
}

#video.live {
    opacity: 1;
}


/* FLOWER CANVAS */

#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 3;

    pointer-events: none;
}


/* DARK OVERLAY */

#shade {
    position: fixed;
    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,0.35) 100%
        );
}


/* TOP BAR */

.top {

    position: fixed;

    top: 24px;
    left: 28px;
    right: 28px;

    display: flex;
    justify-content: space-between;

    z-index: 10;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: 0.25em;

    color: rgba(255,255,255,0.6);
}

.top .dim {
    color: rgba(255,255,255,0.2);
}


/* FLOWER LABEL */

#label {

    position: fixed;

    left: 28px;
    bottom: 28px;

    z-index: 10;

    opacity: 0;

    transform: translateY(8px);

    transition:
        opacity .5s ease,
        transform .5s ease;

    pointer-events: none;
}

#label.show {

    opacity: 1;

    transform: translateY(0);
}

#flowerName {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 25px;

    letter-spacing: -0.02em;
}

#flowerMeaning {

    margin-top: 5px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .22em;

    color:
        rgba(255,255,255,.35);
}


/* GESTURE */

#gesture {

    position: fixed;

    right: 28px;
    bottom: 28px;

    z-index: 10;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .2em;

    color:
        rgba(255,255,255,.3);

    text-transform: uppercase;
}


/* INTRO */

#intro {

    position: fixed;
    inset: 0;

    z-index: 50;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: #000;

    transition:
        opacity .8s ease;
}

#intro.hide {

    opacity: 0;

    pointer-events: none;
}

#title {

    margin: 0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(52px, 9vw, 120px);

    font-weight: 400;

    letter-spacing: -.055em;

    line-height: .85;
}

#sub {

    margin-top: 20px;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .35em;

    color:
        rgba(255,255,255,.3);

    text-transform: uppercase;
}

#enter {

    margin-top: 48px;

    padding: 13px 25px;

    background: transparent;

    border: 1px solid
        rgba(255,255,255,.28);

    color: white;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 8px;

    letter-spacing: .22em;

    cursor: pointer;

    transition:
        background .25s ease,
        color .25s ease;

}

#enter:hover {

    background: white;

    color: black;

}


/* LOADING */

#loading {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 45;

    display: none;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    letter-spacing: .2em;

    color:
        rgba(255,255,255,.6);
}

#loading.show {
    display: block;
}


/* ERROR */

#error {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 60;

    display: none;

    width: 340px;

    text-align: center;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 9px;

    line-height: 1.8;

    color:
        rgba(255,255,255,.55);
}

#error.show {
    display: block;
}

#error strong {

    display: block;

    margin-bottom: 10px;

    color: white;

    letter-spacing: .18em;

}


/* MOBILE */

@media(max-width:600px){

    .top {
        left: 18px;
        right: 18px;
        top: 18px;
    }

    #label {
        left: 18px;
        bottom: 20px;
    }

    #gesture {
        right: 18px;
        bottom: 20px;
    }

}

</style>
</head>


<body>


<!-- CAMERA -->

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>


<!-- FLOWERS -->

<canvas id="canvas"></canvas>


<div id="shade"></div>


<!-- UI -->

<div class="top">

    <div>
        HAND <span class="dim">/</span> GARDEN
    </div>

    <div id="status">
        OFFLINE
    </div>

</div>


<div id="label">

    <div id="flowerName">
        Rose
    </div>

    <div id="flowerMeaning">
        LOVE · COURAGE
    </div>

</div>


<div id="gesture">
    SHOW YOUR HAND
</div>


<!-- INTRO -->

<div id="intro">

    <h1 id="title">
        Hand Garden
    </h1>

    <div id="sub">
        A gesture becomes a flower
    </div>

    <button id="enter">
        ENTER
    </button>

</div>


<div id="loading">
    INITIALISING CAMERA
</div>


<div id="error">

    <strong>
        CAMERA ERROR
    </strong>

    Please allow camera access<br>
    and reload the page.

</div>



<!-- =====================================================
     MEDIAPIPE
===================================================== -->

<script type="module">

import {
    FilesetResolver,
    HandLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const intro =
    document.getElementById("intro");

const enter =
    document.getElementById("enter");

const loading =
    document.getElementById("loading");

const error =
    document.getElementById("error");

const status =
    document.getElementById("status");

const gestureText =
    document.getElementById("gesture");

const label =
    document.getElementById("label");

const flowerName =
    document.getElementById("flowerName");

const flowerMeaning =
    document.getElementById("flowerMeaning");


/* =====================================================
   CANVAS
===================================================== */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        window.innerWidth * dpr;

    canvas.height =
        window.innerHeight * dpr;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   STATE
===================================================== */

let handLandmarker = null;

let lastVideoTime = -1;

let currentGesture = null;

let lastFlowerTime = 0;

let flowers = [];

let particles = [];


/* =====================================================
   FLOWER DATA
===================================================== */

const flowersData = {

    ONE: {
        name: "Rose",
        meaning: "LOVE · COURAGE",
        type: "rose"
    },

    TWO: {
        name: "Tulip",
        meaning: "NEW BEGINNINGS",
        type: "tulip"
    },

    THREE: {
        name: "Sunflower",
        meaning: "JOY · POSITIVITY",
        type: "sunflower"
    },

    FIVE: {
        name: "Wildflower",
        meaning: "FREEDOM · GRATITUDE",
        type: "wild"
    }

};


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw new Error(
            "Camera API unavailable"
        );

    }

    const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video: {

                facingMode: "user",

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                }

            },

            audio: false

        });


    video.srcObject =
        stream;


    await new Promise(
        resolve => {

            video.onloadedmetadata =
                resolve;

        }
    );


    await video.play();


    video.classList.add(
        "live"
    );

}


/* =====================================================
   MEDIAPIPE
===================================================== */

async function startHandTracking() {

    const vision =
        await FilesetResolver
        .forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );


    handLandmarker =
        await HandLandmarker
        .createFromOptions(
            vision,
            {

                baseOptions: {

                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                    delegate:
                        "GPU"

                },

                runningMode:
                    "VIDEO",

                numHands:
                    1,

                minHandDetectionConfidence:
                    .5,

                minHandPresenceConfidence:
                    .5,

                minTrackingConfidence:
                    .5

            }
        );

}


/* =====================================================
   FINGER COUNT
===================================================== */

function countFingers(lm) {

    let count = 0;


    /*
       INDEX
    */

    if (
        lm[8].y <
        lm[6].y
    ) count++;


    /*
       MIDDLE
    */

    if (
        lm[12].y <
        lm[10].y
    ) count++;


    /*
       RING
    */

    if (
        lm[16].y <
        lm[14].y
    ) count++;


    /*
       PINKY
    */

    if (
        lm[20].y <
        lm[18].y
    ) count++;


    /*
       THUMB
    */

    const thumb =
        Math.hypot(
            lm[4].x - lm[2].x,
            lm[4].y - lm[2].y
        );

    const thumbBase =
        Math.hypot(
            lm[3].x - lm[2].x,
            lm[3].y - lm[2].y
        );


    if (
        thumb >
        thumbBase * 1.25
    ) count++;


    return count;

}


/* =====================================================
   SCREEN POSITION
===================================================== */

function screenPoint(point) {

    return {

        x:
            (1 - point.x) *
            window.innerWidth,

        y:
            point.y *
            window.innerHeight

    };

}


/* =====================================================
   PLANT
===================================================== */

function plant(type, point) {

    const now =
        performance.now();


    if (
        now - lastFlowerTime <
        900
    ) return;


    lastFlowerTime =
        now;


    flowers.push({

        x:
            point.x,

        y:
            point.y,

        type:
            type,

        scale:
            .65 +
            Math.random() * .45,

        rotation:
            (
                Math.random() -
                .5
            ) * .25,

        age: 0

    });


    if (
        flowers.length >
        30
    ) {

        flowers.shift();

    }


    for (
        let i = 0;
        i < 15;
        i++
    ) {

        particles.push({

            x:
                point.x,

            y:
                point.y,

            vx:
                (
                    Math.random() -
                    .5
                ) * 2,

            vy:
                (
                    Math.random() -
                    .8
                ) * 2,

            life:
                1

        });

    }

}


/* =====================================================
   FLOWER DRAWING
===================================================== */

function stem(length = 100) {

    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );

    ctx.bezierCurveTo(
        8,
        length * .3,
        -8,
        length * .7,
        0,
        length
    );

    ctx.stroke();

}


/* ROSE */

function rose(x,y,s,r){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    ctx.strokeStyle =
        "rgba(151,196,157,.8)";

    ctx.lineWidth = 1.1;

    stem(110);


    ctx.strokeStyle =
        "rgba(255,165,198,.95)";

    for(
        let i=0;
        i<11;
        i++
    ){

        ctx.save();

        ctx.rotate(
            i*Math.PI*2/11
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            -21,
            12,
            21,
            0,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();

    }


    ctx.restore();

}


/* TULIP */

function tulip(x,y,s,r){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    ctx.strokeStyle =
        "rgba(151,196,157,.8)";

    ctx.lineWidth = 1.1;

    stem(110);


    ctx.strokeStyle =
        "rgba(245,167,194,.95)";

    ctx.lineWidth = 1.2;

    ctx.beginPath();

    ctx.moveTo(-26,-5);

    ctx.bezierCurveTo(
        -28,-35,
        -16,-43,
        -7,-25
    );

    ctx.bezierCurveTo(
        0,-50,
        7,-50,
        14,-25
    );

    ctx.bezierCurveTo(
        23,-43,
        29,-30,
        26,-5
    );

    ctx.bezierCurveTo(
        18,15,
        -18,15,
        -26,-5
    );

    ctx.stroke();


    ctx.restore();

}


/* SUNFLOWER */

function sunflower(x,y,s,r){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    ctx.strokeStyle =
        "rgba(151,196,157,.8)";

    ctx.lineWidth = 1.1;

    stem(110);


    ctx.strokeStyle =
        "rgba(250,211,116,.95)";

    for(
        let i=0;
        i<18;
        i++
    ){

        ctx.save();

        ctx.rotate(
            i*Math.PI*2/18
        );

        ctx.beginPath();

        ctx.ellipse(
            0,
            -26,
            7,
            23,
            0,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.restore();

    }


    ctx.fillStyle =
        "rgba(226,176,81,.9)";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* WILDFLOWER */

function wild(x,y,s,r){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(r);

    ctx.scale(s,s);


    for(
        let i=0;
        i<5;
        i++
    ){

        const dx =
            (i-2)*13;


        ctx.strokeStyle =
            "rgba(151,196,157,.72)";

        ctx.beginPath();

        ctx.moveTo(0,0);

        ctx.quadraticCurveTo(
            dx*.3,
            50,
            dx,
            105
        );

        ctx.stroke();


        ctx.strokeStyle =
            [
                "rgba(255,181,210,.95)",
                "rgba(196,180,255,.95)",
                "rgba(255,220,150,.95)",
                "rgba(185,230,198,.95)",
                "rgba(240,200,255,.95)"
            ][i];


        for(
            let p=0;
            p<6;
            p++
        ){

            ctx.save();

            ctx.translate(
                dx,
                -25
            );

            ctx.rotate(
                p*Math.PI*2/6
            );

            ctx.beginPath();

            ctx.ellipse(
                0,
                -8,
                4,
                10,
                0,
                0,
                Math.PI*2
            );

            ctx.stroke();

            ctx.restore();

        }

    }


    ctx.restore();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    for(
        const f of flowers
    ){

        f.age += .025;

        const growth =
            Math.min(
                f.age,
                1
            );


        const scale =
            f.scale *
            growth;


        if(
            f.type === "rose"
        )
            rose(
                f.x,
                f.y,
                scale,
                f.rotation
            );


        if(
            f.type === "tulip"
        )
            tulip(
                f.x,
                f.y,
                scale,
                f.rotation
            );


        if(
            f.type === "sunflower"
        )
            sunflower(
                f.x,
                f.y,
                scale,
                f.rotation
            );


        if(
            f.type === "wild"
        )
            wild(
                f.x,
                f.y,
                scale,
                f.rotation
            );

    }


    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += .015;

        p.life -= .018;


        if(
            p.life <= 0
        ){

            particles.splice(i,1);

            continue;

        }


        ctx.save();

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            "#fff";

        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            "#fff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            1.2,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }


    requestAnimationFrame(
        render
    );

}

render();


/* =====================================================
   HAND DETECTION
===================================================== */

async function detect(){

    if(
        !handLandmarker ||
        video.readyState < 2
    ){

        requestAnimationFrame(
            detect
        );

        return;

    }


    if(
        video.currentTime !==
        lastVideoTime
    ){

        lastVideoTime =
            video.currentTime;


        try{

            const result =
                handLandmarker
                .detectForVideo(
                    video,
                    performance.now()
                );


            if(
                result.landmarks &&
                result.landmarks.length
            ){

                const lm =
                    result.landmarks[0];


                const fingers =
                    countFingers(lm);


                let data = null;


                if(
                    fingers === 1
                )
                    data =
                        flowersData.ONE;


                if(
                    fingers === 2
                )
                    data =
                        flowersData.TWO;


                if(
                    fingers === 3
                )
                    data =
                        flowersData.THREE;


                if(
                    fingers === 5
                )
                    data =
                        flowersData.FIVE;


                if(data){

                    if(
                        currentGesture !==
                        fingers
                    ){

                        currentGesture =
                            fingers;


                        flowerName.textContent =
                            data.name;

                        flowerMeaning.textContent =
                            data.meaning;

                        label.classList.add(
                            "show"
                        );

                        gestureText.textContent =
                            "GESTURE DETECTED";

                    }


                    const point =
                        screenPoint(
                            lm[8]
                        );


                    plant(
                        data.type,
                        point
                    );

                }

            }else{

                currentGesture =
                    null;

                gestureText.textContent =
                    "SHOW YOUR HAND";

            }

        }catch(err){

            console.error(
                "Detection error:",
                err
            );

        }

    }


    requestAnimationFrame(
        detect
    );

}


/* =====================================================
   ENTER
===================================================== */

enter.addEventListener(
    "click",
    async () => {

        console.log(
            "HAND GARDEN START"
        );


        enter.disabled =
            true;

        enter.textContent =
            "LOADING";


        loading.classList.add(
            "show"
        );


        try{

            /*
             * CAMERA FIRST
             */

            status.textContent =
                "CAMERA";


            await startCamera();


            /*
             * MEDIAPIPE SECOND
             */

            status.textContent =
                "LOADING TRACKER";


            await startHandTracking();


            /*
             * EXPERIENCE
             */

            loading.classList.remove(
                "show"
            );


            intro.classList.add(
                "hide"
            );


            status.textContent =
                "LIVE";


            detect();


        }catch(err){

            console.error(
                "START ERROR:",
                err
            );


            loading.classList.remove(
                "show"
            );


            error.classList.add(
                "show"
            );


            status.textContent =
                "ERROR";


            enter.disabled =
                false;

            enter.textContent =
                "RETRY";

        }

    }
);

</script>

</body>
</html>
