<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hand Garden 🌸</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        #status {
            color: #aaa;
            font-size: 18px;
        }

        #count {
            font-size: 32px;
            margin: 15px;
        }

        video {
            width: 90%;
            max-width: 700px;
            border-radius: 20px;
            transform: scaleX(-1);
        }
    </style>
</head>

<body>

    <h1>🌸 Hand Garden</h1>

    <p id="status">Starting camera...</p>

    <div id="count">👋 Show me your hand</div>

    <video id="video" autoplay playsinline></video>


    <script type="module">

        import {
            HandLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1";


        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const count = document.getElementById("count");


        // 1. Start camera FIRST
        async function startCamera() {

            try {

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });

                video.srcObject = stream;

                status.textContent = "Camera ready 📷";

            } catch (error) {

                status.textContent = "Camera error: " + error.message;

                console.error(error);
            }
        }


        // 2. Load hand tracking
        async function startHandTracking() {

            try {

                status.textContent = "Loading hand tracking...";


                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
                );


                const handLandmarker =
                    await HandLandmarker.createFromModelPath(
                        vision,
                        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
                    );


                status.textContent = "Hand tracking ready ✨";


                function detect() {

                    if (video.readyState >= 2) {

                        const results =
                            handLandmarker.detectForVideo(
                                video,
                                performance.now()
                            );


                        if (results.landmarks.length > 0) {

                            count.textContent = "✋ Hand detected!";

                        } else {

                            count.textContent =
                                "👋 Show me your hand";
                        }
                    }

                    requestAnimationFrame(detect);
                }


                detect();


            } catch (error) {

                status.textContent =
                    "Hand tracking error — check Console";

                console.error(error);
            }
        }


        // Start both
        startCamera();
        startHandTracking();

    </script>

</body>
</html>
